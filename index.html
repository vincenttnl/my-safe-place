.c02-pas{display:flex;align-items:center;gap:8px;width:100%;box-sizing:border-box;min-height:1.625rem;padding:0 10px;border:0;border-radius:10px;background:rgba(255,255,255,.08);color:#FFFFFF;text-align:left;font-family:var(--font-body);white-space:nowrap;cursor:default}
button.c02-pas{cursor:pointer}
.c02-pas i{flex:none;min-width:.75rem;font:800 1.125rem/1 var(--font-body);font-style:normal;color:#FF4F93}
.c02-pas b{flex:none;font:700 .8125rem/1.2 var(--font-body);color:#FFFFFF}
.c02-pas small{flex:1;min-width:0;text-align:right;font:italic 400 .71875rem/1.2 var(--font-body);color:rgba(255,255,255,.7);overflow:hidden;text-overflow:ellipsis}
.c02-att{margin:10px 0 0;display:flex;flex-direction:column;gap:5px;align-items:stretch}
.c02-row{display:flex;align-items:center;gap:8px;min-height:2rem;padding:5px 10px;box-sizing:border-box;border:0;border-radius:10px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.86);text-align:left;font:400 .8125rem/1.3 var(--font-body);cursor:pointer}
.c02-attq{font-weight:700;color:#FFFFFF}
.c02-lu .lu-pts i{background:#FFFFFF}
.c02-p105,.c02-retry{align-self:flex-start;border-radius:999px;font-weight:700;padding:0 14px;min-height:2.25rem}
.c02-p105{background:#FF006E;color:#FFFFFF}
.c11-cpt{margin:10px 2px 0;font:600 .8125rem/1.3 var(--font-body);color:rgba(255,255,255,.86)}
.c02-plan{margin:10px 0 0;display:flex;align-items:center;gap:6px;min-height:52px;padding:0 8px 0 0;border-radius:12px;background:rgba(255,255,255,.08)}
.c02-plan-go{flex:1;min-width:0;display:flex;align-items:center;gap:8px;min-height:52px;padding:6px 6px 6px 12px;border:0;background:none;color:#FFFFFF;text-align:left;font-family:var(--font-body);cursor:pointer}
.c02-plan-tx{flex:1;min-width:0}
.c02-plan-tx b{display:block;font:700 .875rem/1.25 var(--font-body);color:#FFFFFF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c02-plan-tx em{display:block;font:400 .75rem/1.3 var(--font-body);font-style:normal;color:rgba(255,255,255,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c02-chev{flex:none;font:400 22px/1 var(--font-body);color:rgba(255,255,255,.6)}
/* le champ blanc 50 pt rayon 25 (HbBarre inchangée) */
.c02-lu .hb-bar{height:50px;margin-top:10px}
.hb.lu.c02-lu .hb-cap2,.hb.lu.c02-lu .hb-cap2:focus-within,:root[data-theme] .hb.lu.c02-lu .hb-cap2{min-height:50px;border-radius:25px;background:#FFFFFF!important;box-shadow:none;padding:5px 5px 5px 2px}
.hb.lu.c02-lu .hb-cap2.open{border-radius:25px;box-shadow:0 -8px 32px rgba(0,0,0,.35)}
.c02-lu .lu-st{color:#FF006E}
/* 🌙 C04 (28/10) — l'écran du plan « Ce soir à Paris » (DA C : fond #F7F7F7, cellules blanches ombrées ; teinte #FFF0F6 de la preuve ;
   texte magenta = #C4005A, magenta plein #FF006E = fonds et boutons seulement ; heures en lime encre). Sources : vague3/changer, vague4/changer-final, vague5/changer-v3. */
[data-pe=root].c4{background:var(--m-bg);color:var(--m-ink)}
.c4-hdr{flex:none;position:relative;z-index:5;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;height:56px;padding:0 16px;background:var(--m-bg);transition:box-shadow .2s}
/* Chasse C04 : en-tête opaque + filet quand le plan défile (le texte coupé net sous l'en-tête se lisait comme une transparence) ; la bande de l'encoche est déjà au fond --m-bg du calque [data-pe=root] */
.c4-hdr[data-c4-ombre]{box-shadow:0 1px 0 var(--m-sep),0 6px 12px -8px rgba(0,0,0,.18)}
.c4-hdr h2{margin:0;text-align:center;font:700 20px/1.15 var(--font-body);letter-spacing:-.02em;color:var(--m-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c4-rond{width:44px;height:44px;border-radius:999px;border:0;background:var(--m-pill);color:var(--m-ink);box-shadow:var(--m-shadow-rond);display:grid;place-items:center;cursor:pointer;padding:0}
.c4-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px calc(24px + env(safe-area-inset-bottom,0px));scroll-padding:80px 0 120px}
.c4-preuve{display:flex;gap:10px;align-items:flex-start;background:var(--m-mag-tint);border-radius:16px;padding:12px 14px;margin:0 0 12px}
.c4-preuve p{margin:0;flex:1;min-width:0;font:500 15px/1.4 var(--font-body);color:var(--m-ink)}
.c4-preuve b{font-weight:700;color:var(--m-mag-ink)}
.c4-sp{flex:none;width:28px;height:28px;border-radius:999px;background:var(--m-mag);color:#FFFFFF;display:grid;place-items:center;font:700 14px/1 var(--font-body);margin-top:1px}
.c4-dep{display:inline-flex;align-items:center;gap:3px;border:0;background:none;padding:12px 2px;margin:-12px -2px;font:700 15px/1.4 var(--font-body);color:var(--m-ink);cursor:pointer;text-decoration:underline;text-decoration-color:rgba(34,34,34,.25);text-underline-offset:3px}
.c4-cell{position:relative;display:flex;gap:12px;align-items:flex-start;background:var(--m-sf);border-radius:20px;padding:14px 12px 12px;box-shadow:var(--m-shadow);transition:box-shadow .25s}
.c4-num{flex:none;width:30px;height:30px;border-radius:999px;background:var(--m-mag);color:#FFFFFF;display:grid;place-items:center;font:700 15px/1 var(--font-body);font-style:normal}
.c4-num.un{background:var(--m-ink)}
.c4-num.ok{background:var(--m-lime);color:var(--m-ink)}
/* R5 (B4, vote du 02/11) : TOUTES les bulles numérotées en noir (plus de « 1 noir, les autres magenta ») — l'étape faite reste lime */
:root[data-r5="1"] .c4-num:not(.ok),:root[data-r5="1"] .ex5-etape{background:var(--m-ink)}
.c4-tx{flex:1;min-width:0}
.c4-nom{display:block;font:700 17px/1.2 var(--font-body);letter-spacing:-.01em;color:var(--m-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c4-meta{display:block;margin-top:3px;font:500 13.5px/1.3 var(--font-body);color:var(--m-ink2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.c4-dot{display:inline-block;width:8px;height:8px;border-radius:999px;margin-right:6px;vertical-align:1px}
.c4-ouv{font-style:normal;color:var(--m-lime-ink);font-weight:600}
.c4-ko{font-style:normal;color:var(--m-mag-ink);font-weight:600}
.c4-l2{display:block;margin-top:6px;font:600 15.5px/1.3 var(--font-body);color:var(--m-ink);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.c4-h{font-style:normal;color:var(--m-lime-ink);font-weight:700;font-variant-numeric:tabular-nums}
.c4-acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.c4-pill{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;border:0;background:var(--m-btn2);color:var(--m-ink);font:600 14px var(--font-body);cursor:pointer;position:relative}
.c4-pill::after{content:"";position:absolute;left:0;right:0;top:-4px;bottom:-4px}
.c4-ph{flex:none;width:56px;height:56px;border-radius:14px;overflow:hidden;background:var(--m-sep);display:grid;place-items:center;font-size:22px}
.c4-ph img{width:100%;height:100%;object-fit:cover;display:block}
.c4-ph.s44{width:44px;height:44px;border-radius:12px;font-size:18px}
.c4-grip{position:absolute;right:8px;bottom:6px;width:44px;height:44px;display:grid;place-items:center;color:var(--m-ink2);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.c4-cell .c4-ph{margin-bottom:34px}
.c4-walk{display:flex;align-items:center;gap:6px;padding:9px 0 9px 18px;font:500 13.5px var(--font-body);color:var(--m-ink2)}
/* compact (les autres étapes quand « Changer » est ouvert) */
.c4-cell.cp{align-items:center;padding:8px 12px;gap:10px}
.c4-cell.cp .c4-ph{margin:0}
.c4-cpt{flex:1;min-width:0;display:block;text-align:left;border:0;background:none;padding:6px 0;color:var(--m-ink);cursor:pointer}
.c4-cpt b{display:block;font:600 15px/1.2 var(--font-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c4-cpt span{display:block;font:500 13px/1.3 var(--font-body);color:var(--m-ink2);margin-top:1px}
/* le bloc « Changer » (P final) */
.c4-blk{flex-direction:column;align-items:stretch;gap:10px;box-shadow:inset 0 0 0 2px var(--m-mag),var(--m-shadow);padding:12px}
.c4-bh{display:flex;align-items:center;gap:10px}
.c4-bt{flex:1;min-width:0}
.c4-bt b{display:block;font:700 16px/1.2 var(--font-body);color:var(--m-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c4-bt span{display:block;font:500 12.5px/1.3 var(--font-body);color:var(--m-ink2);margin-top:1px}
.c4-fermer{flex:none;display:inline-flex;align-items:center;gap:5px;min-height:36px;padding:0 14px;border-radius:999px;border:0;background:var(--m-pill-on);color:var(--m-pill-on-ink);font:600 13.5px var(--font-body);cursor:pointer;position:relative}
.c4-fermer::after{content:"";position:absolute;left:0;right:0;top:-4px;bottom:-4px}
.c4-big{position:relative;height:150px;border-radius:16px;overflow:hidden;background:var(--m-sep);display:grid;place-items:center}
.c4-big img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.c4-big .emo{font-size:40px}
.c4-st{position:absolute;top:10px;left:10px;font:700 11.5px/1 var(--font-body);font-style:normal;letter-spacing:.04em;text-transform:uppercase;padding:7px 10px;border-radius:999px;background:var(--m-lime);color:var(--m-ink)}
.c4-voir{position:absolute;top:8px;right:8px;display:inline-flex;align-items:center;gap:3px;min-height:32px;padding:0 12px;border-radius:999px;border:0;background:var(--m-on-photo-pill);color:var(--m-on-photo-pill-ink);font:600 13px var(--font-body);cursor:pointer}
.c4-voir::after{content:"";position:absolute;left:-6px;right:-6px;top:-6px;bottom:-6px}
.c4-sous{display:flex;align-items:center;gap:10px}
.c4-stx{flex:1;min-width:0}
.c4-stx b{display:block;font:700 16px/1.2 var(--font-body);color:var(--m-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c4-stx span{display:block;font:500 12.5px/1.3 var(--font-body);color:var(--m-ink2);margin-top:2px}
.c4-say{display:block;font:italic 500 13px/1.3 var(--font-body);color:var(--m-mag-ink);margin-top:3px;overflow-wrap:anywhere}
.c4-rempl{flex:none;display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:12px;border:0;background:var(--m-mag);color:#FFFFFF;font:700 14.5px var(--font-body);cursor:pointer;box-shadow:0 4px 14px rgba(255,0,110,.30);position:relative}
.c4-rempl::after{content:"";position:absolute;left:0;right:0;top:-4px;bottom:-4px}
.c4-rail{display:flex;gap:9px;overflow-x:auto;margin:0 -12px;padding:2px 12px 2px;scrollbar-width:none;scroll-snap-type:x proximity}
.c4-rail::-webkit-scrollbar{display:none}
.c4-sq{flex:none;width:84px;border:0;background:none;padding:0;text-align:left;color:var(--m-ink);cursor:pointer;scroll-snap-align:start}
.c4-sq .im{position:relative;display:grid;place-items:center;width:84px;height:84px;border-radius:14px;overflow:hidden;background:var(--m-sep)}
.c4-sq .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.c4-sq .emo{font-size:24px;color:var(--m-ink2)}
.c4-sq.on .im,.c4-sq.vu .im{box-shadow:inset 0 0 0 3px var(--m-mag)}
.c4-sq.vu .im{box-shadow:inset 0 0 0 3px var(--m-lime)}
/* Chasse C04 : le liseré en box-shadow inset passait SOUS la photo (img en absolute) → invisible dès qu'une vignette a une photo ; on le redessine au-dessus */
.c4-sq.on .im::after,.c4-sq.vu .im::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 3px var(--m-mag);pointer-events:none;z-index:2}
.c4-sq.vu .im::after{box-shadow:inset 0 0 0 3px var(--m-lime)}
.c4-sq .lb{position:absolute;top:5px;left:5px;font:800 10.5px/1 var(--font-body);font-style:normal;padding:4px 7px;border-radius:999px;white-space:nowrap;background:var(--m-mag-tint);color:var(--m-mag-ink)}
.c4-sq.k-cur .lb{background:var(--m-lime);color:var(--m-ink)}
.c4-sq b{display:block;font:600 12px/1.2 var(--font-body);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c4-sq>span:last-child{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font:500 11px/1.25 var(--font-body);color:var(--m-ink2);min-height:27px;overflow:hidden}
.c4-sq>span.say{color:var(--m-mag-ink);font-style:italic}
.c4-sq.k-plus .im{background:var(--m-btn2)}
.c4-sq.k-plus b{color:var(--m-ink2)}
.c4-ajout{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;margin:14px 0 0;border:1.5px dashed var(--m-ink3);border-radius:16px;background:none;color:var(--m-ink);font:600 15px var(--font-body);cursor:pointer}
.c4-champ{display:flex;align-items:center;gap:10px;width:100%;height:52px;margin:12px 0 0;padding:0 16px;border:0;border-radius:26px;background:var(--m-field);box-shadow:var(--m-field-shadow);color:var(--m-ink2);font:400 16px var(--font-body);text-align:left;cursor:pointer}
.c4-champ .c4-lu{color:var(--m-mag);font-size:17px}
.c4-champ .ph{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c4-fade{position:absolute;left:0;right:0;bottom:0;height:calc(96px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(247,247,247,0),var(--m-bg) 55%);pointer-events:none;z-index:3}
.c4-go{position:absolute;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;align-items:center;justify-content:center;gap:8px;height:54px;padding:0 18px;border:0;border-radius:16px;background:var(--m-pill-on);color:#FFFFFF;font:700 16px var(--font-body);box-shadow:0 8px 24px rgba(0,0,0,.18);cursor:pointer}
.c4-go span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c4-go.fin{cursor:default}
.c4-guid .c4-go{right:132px;justify-content:flex-start;padding:0 16px}
.c4-g2{display:flex;flex-direction:column;align-items:flex-start;min-width:0;line-height:1.15;text-align:left}
.c4-g2 small{font:600 12px var(--font-body);color:rgba(255,255,255,.78)}
.c4-g2 b{max-width:100%;font:700 16px var(--font-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c4-jy{position:absolute;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:4;width:108px;height:54px;border:0;border-radius:16px;background:var(--m-lime);color:var(--m-ink);font:700 15.5px var(--font-body);box-shadow:0 8px 24px rgba(0,0,0,.14);cursor:pointer}
[data-pe=root].c4 [data-pe=toast]{bottom:calc(84px + env(safe-area-inset-bottom,0px))!important}
[data-pe=root].c4 [data-pe=toast]{white-space:normal!important;height:auto!important;min-height:44px;width:calc(100% - 32px);box-sizing:border-box;padding:9px 6px 9px 16px!important;border-radius:22px!important;background:var(--m-pill-on)!important;line-height:1.3}
[data-pe=root].c4 [data-pe=toast]>span{overflow:visible!important;flex:1;min-width:0}
[data-pe=root].c4 [data-pe=toast] [data-pe=annuler]{color:#FFFFFF!important;flex:none;min-height:44px}
/* C04 : le menu ⋯ (PlanPop) suit la DA claire C — il restait en verre sombre avec un texte sombre depuis C01 (illisible, mesuré en capture) */
[data-pp=menu]{background:var(--m-sf)!important;color:var(--m-ink)!important;box-shadow:0 18px 50px rgba(0,0,0,.18)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
[data-pp=menu] [data-pp-it]{color:var(--m-ink)!important;border-top-color:var(--m-sep)!important}
[data-pp=menu] [data-pp-it][data-pp-it=supprimer]{color:var(--m-mag-ink)!important}
/* C04 · attente */
.c4-att{position:fixed;inset:0;z-index:1440;background:var(--m-bg);display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 36px) 24px calc(24px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--m-ink)}
.c4-att-h{display:flex;flex-direction:column;align-items:center;gap:12px}
.c4-att-sp{width:56px;height:56px;border-radius:999px;background:var(--m-mag);color:#FFFFFF;display:grid;place-items:center;font:700 26px/1 var(--font-body);animation:c4pulse 1s ease-in-out infinite}
@keyframes c4pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,0,110,.35)}50%{transform:scale(1.08);box-shadow:0 0 0 12px rgba(255,0,110,0)}}
.c4-att-k{font:700 12.5px/1 var(--font-body);letter-spacing:.12em;color:var(--m-mag-ink)}
.c4-att-q{margin:14px 0 0;max-width:340px;font:700 19px/1.3 var(--font-body);color:var(--m-ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.c4-att-ph{margin:14px 0 0;min-height:22px;font:500 16px/1.35 var(--font-body);color:var(--m-ink);animation:c4in .35s ease both}
@keyframes c4in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.c4-att-lent{margin:4px 0 0;min-height:20px;font:500 14px var(--font-body);color:var(--m-ink2)}
.c4-att-map{position:relative;margin:16px 0 0}
.c4-carte{display:block;border-radius:24px;box-shadow:var(--m-shadow)}
.c4-halo{animation:c4halo 1.4s ease-out both;transform-box:fill-box;transform-origin:center}
@keyframes c4halo{from{opacity:.45;transform:scale(.4)}to{opacity:.18;transform:scale(1)}}
.c4-att-n{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font:600 13.5px var(--font-body);color:var(--m-ink2);font-variant-numeric:tabular-nums}
.c4-att-n i{width:8px;height:8px;border-radius:999px;background:var(--m-mag)}
.c4-att-x{margin-top:auto;min-height:48px;min-width:160px;padding:0 24px;border:0;border-radius:999px;background:var(--m-btn2);color:var(--m-ink);font:600 16px var(--font-body);cursor:pointer}
.c4-retry{display:inline-flex;margin-top:8px;min-height:40px;align-items:center;padding:0 14px;border:0;border-radius:999px;background:var(--m-pill);box-shadow:var(--m-shadow-rond);color:var(--m-ink);font:600 14px var(--font-body);cursor:pointer}
@media (prefers-reduced-motion:reduce){.c4-att-sp,.c4-halo,.c4-att-ph{animation:none}}
/* « Plus d'idées » : la feuille déjà filtrée */
.c4-idf{position:fixed;inset:0;z-index:1480;background:rgba(0,0,0,.4);display:flex;align-items:flex-end}
.c4-ids{width:100%;max-height:80%;display:flex;flex-direction:column;background:var(--m-bg);border-radius:28px 28px 0 0;box-shadow:var(--m-sheet-shadow);padding:16px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.c4-idh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.c4-idh>div{flex:1;min-width:0}
.c4-idh b{display:block;font:700 18px/1.2 var(--font-body);color:var(--m-ink)}
.c4-idh span{display:block;font:500 13px/1.3 var(--font-body);color:var(--m-ink2);margin-top:2px}
.c4-idl{flex:1 1 auto;min-height:0;overflow-y:auto;background:var(--m-sf);border-radius:16px;box-shadow:var(--m-shadow)}
.c4-idr{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:8px 12px;border:0;border-top:1px solid var(--m-sep);background:none;text-align:left;color:var(--m-ink);cursor:pointer}
.c4-idr:first-child{border-top:0}
.c4-idt{flex:1;min-width:0}
.c4-idt b{display:block;font:600 15px/1.2 var(--font-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c4-idt span{display:block;font:500 12.5px/1.3 var(--font-body);color:var(--m-ink2);margin-top:2px}
.c4-chev{flex:none;font:400 22px/1 var(--font-body);color:var(--m-ink2)}

<style id="r3-retouches">/* 🎨 R3 (30/10 au soir) — retours iPhone de Vincent sur la v561 (DECISIONS.md § R3, recap-R3.html). TOUT est sous :root[data-r3="1"] (posé au chargement

<script>
// 🔄 SW + mise à jour in-app : le SW fait déjà skipWaiting+claim, donc quand une nouvelle
// version s'active pendant que la page est ouverte → controllerchange → bannière « Mettre à jour »
// (un reload suffit, le HTML est network-first). reg.update() est forcé à chaque retour au premier
// plan car iOS PWA ne vérifie presque jamais tout seul — fini les 2 force-quits.
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then((reg) => {
      let last = 0;
      const check = () => { const now = Date.now(); if (now - last > 60000) { last = now; reg.update().catch(() => {}); } };
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
      window.addEventListener('focus', check);
      setInterval(check, 30 * 60000);
    }).catch(() => {});
    let hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController) { hadController = true; return; } // toute première installation : rien à recharger
      if (document.getElementById('msp-update-banner')) return;
      const b = document.createElement('div');
      b.id = 'msp-update-banner';
      b.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:9000;display:flex;align-items:center;gap:12px;background:#FFFFFF;color:#222222;padding:10px 12px 10px 18px;border-radius:999px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 16px rgba(0,0,0,.06);font-family:system-ui,-apple-system,sans-serif;font-size:14px;font-weight:600;max-width:92vw;white-space:nowrap;';
      const label = document.createElement('span');
      label.textContent = '✨ Nouvelle version dispo';
      const btn = document.createElement('button');
      btn.textContent = 'Mettre à jour';
      btn.style.cssText = 'border:none;border-radius:999px;padding:9px 15px;background:var(--sf2);color:var(--tx);font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;flex-shrink:0;';
      /* 📱 LOT D (21/10) : si « Moi, c'est Lucia » est à l'écran au moment de la mise à jour, elle n'a pas été lue — on lui rend sa place
         (clé existante `myplace_lucia_intro_v1`, jamais renommée) pour qu'elle se présente juste après le rechargement. */
      btn.onclick = () => { try { if (document.querySelector('[data-lu="intro"]')) localStorage.removeItem('myplace_lucia_intro_v1'); } catch (e) {} b.remove(); location.reload(); };
      b.appendChild(label); b.appendChild(btn);
      document.body.appendChild(b);
    });
  });
}
</script>
