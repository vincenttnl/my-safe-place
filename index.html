<style>

*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg-primary:#FFF2F7;--bg-cream:#FFE8F1;--bg-soft:#F5F2EB;/* v11.05 (Vincent) : fond rose pâle n°8 — corps #FFF2F7, entête #FFE8F1 (ex #FFFFFF / #FFF8EC). Les surfaces blanches sont sur --card:#fff, inchangées. */
  --ink-900:#0A0A0A;--ink-600:#3A3A3A;--ink-400:#7A7A7A;--hairline:#E8E4DB;
  --pop-pink:#FF3D8B;--pop-magenta:#E91E63;--pop-orange:#FF6B2C;--pop-yellow:#FFD23F;--pop-lime:#C6FF3D;--pop-violet:#8B5CF6;--pop-cyan:#3DC8FF;
  --font-display:"Fraunces",Georgia,serif;--font-body:"Inter",system-ui,sans-serif;--font-mono:"JetBrains Mono",monospace;
  --radius-sm:8px;--radius-md:16px;--radius-lg:24px;--radius-pill:999px;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.04);--shadow-md:0 8px 24px rgba(0,0,0,0.08);--shadow-lg:0 24px 48px rgba(0,0,0,0.12);--shadow-pop:0 12px 32px rgba(255,61,139,0.25);
  --ease:cubic-bezier(0.4,0,0.2,1);
  --spring:cubic-bezier(.34,1.56,.64,1);/* v10.85 : easing à dépassement — moteur de la lentille de la tab bar */
  /* legacy compat */
  --bg:var(--bg-primary);--card:#fff;--text:var(--ink-900);--muted:var(--ink-400);--border:var(--hairline);--soft:var(--bg-soft);--input:#fff;--radius:var(--radius-md);
}


html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{background:var(--bg-primary);color:var(--ink-900);font-family:var(--font-body);font-size:15px;line-height:1.55;min-height:100vh;transition:background .3s,color .3s;padding-bottom:96px;overflow-x:clip;max-width:100vw;touch-action:manipulation}/* v10.85 : 80→96px — la tab bar №7 flotte détachée du bord, il lui faut plus de garde */
textarea,input,select{font-family:var(--font-body);background:var(--input);color:var(--ink-900);border-color:var(--hairline)}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#ccc;border-radius:4px}

.leaflet-popup-content-wrapper{border-radius:var(--radius-md);box-shadow:var(--shadow-md)}
.leaflet-popup-content{margin:10px 14px;font-family:var(--font-body)}
/* Marqueur "tu es ici" — point bleu + halo qui pulse */
.me-marker-wrap{position:relative}
.me-marker-wrap .me-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:999px;background:#2D7DFF;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,0.12),0 2px 7px rgba(0,0,0,0.4);transform:translate(-50%,-50%)}
.me-marker-wrap .me-pulse{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:999px;background:rgba(45,125,255,0.45);transform:translate(-50%,-50%);animation:mePulse 2s var(--ease) infinite}
@keyframes mePulse{0%{width:16px;height:16px;opacity:0.7}100%{width:64px;height:64px;opacity:0}}
/* Spot sélectionné sur la carte — halo/aura qui pulse (même langage que "tu es ici") + étiquette nom */
.spot-sel-wrap{position:relative}
.spot-sel-wrap .spot-sel-halo{position:absolute;top:50%;left:50%;width:44px;height:44px;border-radius:999px;transform:translate(-50%,-50%);filter:blur(5px);opacity:0.4;animation:spotBreath 2.8s ease-in-out infinite}
@keyframes spotBreath{0%,100%{opacity:0.3;transform:translate(-50%,-50%) scale(0.9)}50%{opacity:0.48;transform:translate(-50%,-50%) scale(1.06)}}
.spot-sel-wrap .spot-sel-core{position:absolute;top:50%;left:50%;width:15px;height:15px;border-radius:999px;border:3px solid #fff;transform:translate(-50%,-50%);box-shadow:0 0 0 1px rgba(0,0,0,0.12),0 2px 8px rgba(0,0,0,0.4)}
.spot-sel-wrap .spot-sel-label{position:absolute;left:50%;bottom:calc(50% + 22px);transform:translateX(-50%);background:#16131A;color:#fff;font-size:12px;font-weight:700;font-family:var(--font-body);padding:5px 10px;border-radius:9px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,0.32);pointer-events:none}
.spot-sel-wrap .spot-sel-label::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#16131A}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(100%)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes goldGlow{0%,100%{box-shadow:0 0 0 2.5px #E8B93B,0 10px 26px rgba(232,185,59,0.35)}50%{box-shadow:0 0 0 2.5px #F7D262,0 12px 38px rgba(232,185,59,0.62)}}
@keyframes haloPulse{0%,100%{opacity:.7;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.12)}}/* v10.72 : halo néon entête accueil (style №1) */
@keyframes pulseB{0%{box-shadow:0 0 0 0 rgba(255,61,139,.45)}70%{box-shadow:0 0 0 10px rgba(255,61,139,0)}100%{box-shadow:0 0 0 0 rgba(255,61,139,0)}} /* v10.63 : CTA collectif A14 « fantôme qui pulse » */
/* v10.97 : fondu-glissé des exemples de recherche IA. Pas de transform persistant en fin
   d'animation (fill both) — un transform figé ferait de l'élément un containing block, le piège
   qui a coûté le bouton retour en v10.84. Ici l'animation se termine et rend la main. */
@keyframes nlExIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.nl-ex{animation:nlExIn .34s var(--ease)}
@media (prefers-reduced-motion:reduce){.cta-pulse,.nl-ex{animation:none!important}}

.fade-in{animation:fadeIn .3s ease-out both}
.slide-up{animation:slideUp .35s var(--ease) both}
.press{transition:transform .12s ease;cursor:pointer}
.press:active{transform:scale(.96)}

/* ✕ rouge « Cerise bordée » (choix Vincent 11/07) — croix de fermeture unifiée */
/* Pastille retour v10.42 (choix Vincent B3 v2 №8) : cercle blanc bordure rose, flèche rose */
.msp-x{background:#fff;border:2px solid var(--pop-pink);box-shadow:0 4px 12px rgba(255,61,139,.22);transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s}
.msp-x svg{transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.msp-x:active{transform:scale(.82)}
@media(hover:hover){.msp-x:hover svg{transform:translateX(-2px)}.msp-x:hover{box-shadow:0 6px 18px rgba(255,61,139,.35)}}

/* Bottom nav - Partiful style */
/* v10.85 — TAB BAR №7 « lentille qui grossit en transit » (choix Vincent 15/07, maquette
   _explorations/local_tabbar-25.html). Remplace le néon rose v10.49/v10.50.
   Barre flottante en verre détachée du bord + capsule qui GLISSE d'un onglet à l'autre en enflant
   pendant le trajet, à la façon de la loupe WhatsApp/iOS 26.
   ⚠️ L'effet EST le décalage des durées : la capsule enfle 340ms (classe .transit, posée en JS) alors
   que son trajet dure 500ms → elle commence à dégonfler AVANT d'arriver. Ne pas aligner les deux.
   ⚠️ isolation:isolate est obligatoire, sinon le backdrop-filter de la capsule va chercher le fond de
   toute la page au lieu de celui de la barre. */
.bottom-nav{position:fixed;left:0;right:0;bottom:0;padding:0 12px calc(10px + env(safe-area-inset-bottom,4px));z-index:90;isolation:isolate;pointer-events:none}
.nav-inner{position:relative;display:flex;align-items:center;height:62px;max-width:600px;margin:0 auto;border-radius:31px;pointer-events:auto;
  background:rgba(255,255,255,.72);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);
  border:1px solid rgba(255,255,255,.65);box-shadow:0 12px 32px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.5)}
.bottom-nav button{position:relative;z-index:2;flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:none;border:0;cursor:pointer;padding:0;color:var(--ink-900);font-family:var(--font-body);font-size:9px;font-weight:800;
  -webkit-tap-highlight-color:transparent;transition:color .3s var(--ease)}
.bottom-nav button .nav-icon{font-size:22px;line-height:1;transition:transform .4s var(--spring)}
.bottom-nav button.active .nav-icon{transform:scale(1.08)}
/* la capsule — position et largeur écrites en JS (placeNavInd), jamais en CSS */
.nav-ind{position:absolute;z-index:1;left:0;top:9px;width:0;height:44px;border-radius:22px;pointer-events:none;
  background:rgba(255,255,255,.42);backdrop-filter:blur(2px) saturate(1.6) brightness(1.14);-webkit-backdrop-filter:blur(2px) saturate(1.6) brightness(1.14);
  border:1px solid rgba(255,255,255,.85);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 4px 14px rgba(0,0,0,.14);
  transition:left .5s var(--spring),width .5s var(--spring),transform .5s var(--spring)}
.nav-ind.transit{transform:scale(1.22)}
/* badge chiffré (onglet Events). z-index 3 > capsule : il reste lisible quand la lentille enfle dessous. */
.nav-badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  background:var(--pop-pink);color:#fff;font-size:9.5px;font-weight:900;display:flex;align-items:center;justify-content:center;
  border:1.5px solid rgba(255,255,255,.92);box-shadow:0 2px 6px rgba(255,61,139,.5);z-index:3}
@media(prefers-reduced-motion:reduce){.nav-ind{transition:none}.nav-ind.transit{transform:none}}

/* Section titles - Partiful */
.section-title{font-family:var(--font-display);font-weight:900;font-size:28px;letter-spacing:-0.015em;color:var(--ink-900);line-height:1.05}
.section-sub{font-family:var(--font-body);font-size:13px;color:var(--ink-400);margin-top:4px}
/* Labels typo №26 « ✦ Fraunces italique » (v10.63) — remplace la petite écriture mono grise partout */
.mono-label{font-family:var(--font-display);font-style:italic;font-weight:700;font-size:14px;letter-spacing:normal;text-transform:none;color:var(--ink-600)}
.mono-label::before{content:"✦ ";color:var(--pop-pink);font-style:normal}
/* DA v10.39 — en-têtes dynamiques : pastille dégradée (remplace le mono-label gris des heros) + titres 1 ligne */
.grad-pill{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--pop-pink),var(--pop-violet));color:#fff;font-family:var(--font-body);font-size:12px;font-weight:800;letter-spacing:0.02em;padding:5px 12px;border-radius:999px;box-shadow:0 6px 16px rgba(255,61,139,0.28);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grad-lbl{font-family:var(--font-display);font-style:italic;font-weight:700;font-size:14px;letter-spacing:normal;text-transform:none;color:var(--ink-600)} /* v10.63 : homogénéisé sur le style label ✦ №26 (retour Vincent) */
.grad-lbl::before{content:"✦ ";color:var(--pop-pink);font-style:normal}
.hero-line{font-family:var(--font-display);font-weight:900;line-height:1;letter-spacing:-0.02em;margin:0;white-space:nowrap;font-size:clamp(20px,7.4vw,31px);text-align:center;width:100%}/* v10.72 : titre centré + pleine largeur sur chaque onglet (retour Vincent) */
/* v10.52 — bouton ↑ ROSE LÉGER (retour Vincent 13/07 : exit le noir agressif), plus bas, chevron SVG centré */
.msp-totop{position:fixed;right:16px;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:89;width:44px;height:44px;border-radius:999px;border:1.5px solid #FFB8D4;cursor:pointer;background:#FFE4F0;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(255,61,139,0.25);animation:totopIn .25s var(--ease) both;padding:0}
@keyframes totopIn{from{opacity:0;transform:translateY(14px) scale(.85)}to{opacity:1;transform:none}}

/* Category grid - Partiful */
.cat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.cat-card{display:flex;flex-direction:column;align-items:flex-start;padding:14px 10px;border-radius:var(--radius-md);cursor:pointer;transition:all .2s var(--ease);text-align:left;border:none;background:transparent}
.cat-card:active{transform:scale(.97)}
.cat-card .cat-emoji{font-size:28px;margin-bottom:6px}
.cat-card .cat-name{font-family:var(--font-body);font-weight:700;font-size:14px;color:var(--ink-900)}
.cat-card .cat-count{font-family:var(--font-mono);font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:var(--ink-600);margin-top:2px}
/* 🎨 Grille « Choisis ton mood » — style №33 validé (stickers photo + teinte cat + cadre couleur) v10.44 */
.mood-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mood-card{position:relative;aspect-ratio:1/0.66;border-radius:15px;overflow:hidden;cursor:pointer;padding:0;border:2.5px solid var(--ink-900);box-shadow:4px 5px 0 rgba(10,10,10,0.82);transition:transform .18s var(--ease)}
.mood-card:active{transform:scale(.97)}
.mood-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mood-card .m-ov{position:absolute;inset:0}
.mood-card .m-em{position:absolute;top:8px;left:9px;font-size:24px;z-index:2;filter:drop-shadow(0 1px 5px rgba(0,0,0,0.55))}
.mood-card .m-lab{position:absolute;left:0;right:0;bottom:0;padding:9px 11px;z-index:2;color:#fff;text-align:left;text-shadow:0 1px 8px rgba(0,0,0,0.6)}
.mood-card .m-lab .m-n{font-family:var(--font-display);font-weight:900;font-size:17px;letter-spacing:-0.01em;line-height:1}
/* v10.51 — compteur mood №2 (choix Vincent) : « Rooftops · 7 » sur UNE ligne aérée (l'ancien mono inline s'écrasait contre le nom) */
.mood-card .m-lab .m-c{font-family:var(--font-body);font-weight:700;font-size:13px;opacity:.85}
/* 💎 PremiumModal widget v10.44 : taglines rotatives + tableau A2 point pulsant */
@keyframes liveBlink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes mspFade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes mspPulseDot{0%,100%{opacity:.35}50%{opacity:1}}
.pm-dot{width:7px;height:7px;border-radius:999px;background:#FF2D9E;flex-shrink:0;animation:mspPulseDot 1.4s infinite}

/* Spot cards */
.spot-card-v2{background:var(--card);border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm);transition:transform .2s var(--ease),box-shadow .2s var(--ease);cursor:pointer;border:1px solid var(--hairline)}
.spot-card-v2:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.spot-card-v2:active{transform:scale(.98)}
.spot-card-v2 .card-photo{width:100%;height:160px;object-fit:cover;background:var(--bg-soft)}
.spot-card-v2 .card-body{padding:14px 16px}
.spot-card-v2 .card-name{font-family:var(--font-body);font-weight:600;font-size:16px;color:var(--ink-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.spot-card-v2 .card-meta{font-family:var(--font-body);font-size:12.5px;color:var(--ink-400);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:var(--radius-pill);font-size:11px;font-weight:600;font-family:var(--font-body);white-space:nowrap}

/* Modal overlay - Partiful */
.modal-overlay{position:fixed;inset:0;background:rgba(10,10,10,0.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal-sheet{position:relative;background:var(--bg-primary);border-radius:24px 24px 0 0;width:100%;max-width:600px;max-height:94vh;overflow:auto;padding:20px 22px calc(20px + env(safe-area-inset-bottom,0px))}
.modal-sheet .sheet-handle{display:none}/* v10.73 : poignées décoratives « trait iOS » retirées partout (confondues avec un retour — retour Vincent). Le vrai drag-handle des filtres n'utilise PAS cette classe → conservé. */
.modal-center{position:fixed;inset:0;background:rgba(10,10,10,0.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-center .modal-box{position:relative;background:var(--bg-primary);border-radius:var(--radius-lg);width:100%;max-width:440px;max-height:90vh;overflow:auto;padding:24px;box-shadow:var(--shadow-lg)}

/* Pill buttons - Partiful */
.pill-btn{padding:8px 9px;border-radius:var(--radius-pill);border:1px solid var(--hairline);background:#fff;cursor:pointer;font-size:12.5px;font-weight:500;font-family:var(--font-body);color:var(--ink-900);transition:all .15s var(--ease)}
/* v10.43 : actif = OUTLINE (langage B1 №4 étendu à toutes les pastilles) */
.pill-btn.active{border:1.5px solid var(--pop-pink);background:#fff;color:var(--pop-pink);font-weight:700}
.pill-btn:active{transform:scale(.95)}
/* v10.87 — Propositions « Stories » (variante №1 validée par Vincent le 15/07, ex-bloc .pl-* v10.72 remplacé) :
   plein écran, un dégradé par question, 6 barres cliquables (cible tactile 21px, pas le trait de 3px),
   « Tout » = groupe VIDE → le compteur monte, il ne chute jamais. + onglet ★ recherches enregistrées. */
.pq-wrap{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;height:100dvh;overflow:hidden;background:var(--bg-cream)}
.pq-in{position:relative;flex:1;display:flex;flex-direction:column;width:100%;max-width:600px;margin:0 auto;min-height:0;overflow:hidden}
.pq-bg{position:absolute;inset:0;z-index:0;transition:background .35s var(--ease)}
.pq-top{position:relative;z-index:2;flex:0 0 auto;padding:calc(8px + env(safe-area-inset-top,0px)) 18px 8px}
.pq-body{position:relative;z-index:2;flex:1;min-height:0;overflow:hidden;padding:0 18px}
.pq-foot{position:relative;z-index:2;flex:0 0 auto;padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px))}
.pq-scy{height:100%;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pq-scy::-webkit-scrollbar{display:none}
/* min-height:100% + justify-center : centré quand ça rentre, rien de rogné quand ça dépasse */
.pq-fill{display:flex;flex-direction:column;justify-content:center;min-height:100%;gap:8px;padding:8px 0}
.pq-h1{font-family:var(--font-display);font-weight:900;letter-spacing:-.03em;line-height:1.02;color:#fff;margin:0}
.pq-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.pq-bars{display:flex;gap:3px;margin:0 -4px 2px}
.pq-bars .seg{flex:1;border:none;background:transparent;padding:9px 4px;display:block;cursor:pointer;-webkit-tap-highlight-color:transparent}
.pq-bars .seg i{display:block;height:3px;border-radius:2px;background:rgba(255,255,255,.3);transition:background .2s var(--ease),height .2s var(--ease)}
.pq-bars .seg.done i{background:rgba(255,255,255,.95)}
.pq-bars .seg.here i{background:#fff;height:5px}

.pq-rnd[disabled]{opacity:.25;cursor:default}
.pq-skip{border:none;background:transparent;color:rgba(255,255,255,.82);font-family:var(--font-body);font-size:13px;font-weight:800;padding:8px 10px;border-radius:999px;white-space:nowrap;text-decoration:underline;text-underline-offset:3px;cursor:pointer;flex:0 0 auto}
.pq-cta{width:100%;border:none;border-radius:999px;background:#fff;font-family:var(--font-body);font-weight:900;font-size:15px;padding:15px;cursor:pointer;box-shadow:0 10px 26px rgba(0,0,0,.18)}
.pq-brand{font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;color:rgba(255,255,255,.7);white-space:nowrap}
.pq-tabs{display:flex;gap:3px;background:rgba(255,255,255,.18);border-radius:999px;padding:3px;flex:0 0 auto}
.pq-tab{border:none;background:rgba(255,255,255,.16);color:#fff;font-family:var(--font-body);font-size:11.5px;font-weight:800;padding:6px 12px;border-radius:999px;white-space:nowrap;cursor:pointer}/* v10.99 : l'inactif garde une pastille visible (avant : transparent → invisible) */

.anim-delay-4{animation:fadeInUp .5s var(--ease) 3.5s both}

@keyframes mspPop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(0.3)}
  20%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}

.toast-out{animation:fadeOut .25s var(--ease) both}
@keyframes fadeOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(8px)}}

function stockPhotos(spot) {
  const cat = spot.cats[0] || "resto";
  const pool = PHOTO_POOLS[cat] || PHOTO_POOLS.resto;
  const seed = spot.id.split("").reduce((a, c) => a + c.charCodeAt(0), 0);
  const start = seed % pool.length;
  const photos = [spot.photo];
  for (let i = 1; i < 4; i++) {
    const idx = (start + i) % pool.length;
    if (!photos.includes(pool[idx])) photos.push(pool[idx]);else photos.push(pool[(idx + 3) % pool.length]);
  }
  return photos;
}

<script>
// 🔄 SW + mise à jour in-app : le SW fait déjà skipWaiting+claim, donc quand une nouvelle
// version s'active pendant que la page est ouverte → controllerchange → bannière « Mettre à jour »
// (un reload suffit, le HTML est network-first). reg.update() est forcé à chaque retour au premier
// plan car iOS PWA ne vérifie presque jamais tout seul — fini les 2 force-quits.
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then((reg) => {
      let last = 0;
      const check = () => { const now = Date.now(); if (now - last > 60000) { last = now; reg.update().catch(() => {}); } };
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
      window.addEventListener('focus', check);
      setInterval(check, 30 * 60000);
    }).catch(() => {});
    let hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController) { hadController = true; return; } // toute première installation : rien à recharger
      if (document.getElementById('msp-update-banner')) return;
      const b = document.createElement('div');
      b.id = 'msp-update-banner';
      b.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:9000;display:flex;align-items:center;gap:12px;background:#171726;color:#fff;padding:10px 12px 10px 18px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.35);font-family:system-ui,-apple-system,sans-serif;font-size:14px;font-weight:600;max-width:92vw;white-space:nowrap;';
      const label = document.createElement('span');
      label.textContent = '✨ Nouvelle version dispo';
      const btn = document.createElement('button');
      btn.textContent = 'Mettre à jour';
      btn.style.cssText = 'border:none;border-radius:999px;padding:9px 15px;background:linear-gradient(135deg,#FF2D9E,#7C3AED);color:#fff;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit;flex-shrink:0;';
      btn.onclick = () => { b.remove(); location.reload(); };
      b.appendChild(label); b.appendChild(btn);
      document.body.appendChild(b);
    });
  });
}
</script>
