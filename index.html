   de le mettre en jour. Et tu vas enlever le auto sur le thème, nuit de base et possibilité jour. »
   Le commentaire d'origine annonçait une migration « quand la conversion sera complète + testée
   device » : elle l'est. Le mode Nuit a été bouclé le 06/08 (4 verdicts de Vincent, banc
   `_test-charte-nuit.mjs` à 42/42) et le sujet a été déclaré CLOS.
   C'est aussi ce que l'app EST : une app de sorties, qu'on ouvre le soir.

   ⚠️ On ne touche PAS aux gens qui ont déjà choisi : une valeur explicite en localStorage
   ('light' comme 'dark') continue d'être respectée. Seul le cas « jamais choisi » bascule.
   ⚠️ 'system' n'est plus proposé dans les réglages, mais reste HONORÉ ici : des installs existantes
   le portent, et le supprimer les renverrait au défaut sans qu'elles aient rien demandé. */
(function(){
  /* 🌙 18/09/2026 — LA NUIT EST L'IDENTITÉ DE SPOT 105 (décision Vincent, ferme) : le mode Jour SORT DE
     L'OFFRE. Le thème effectif est 'dark' pour TOUT LE MONDE, y compris qui avait 'light' ou 'system'

     menu Ajouter, Profil) — « sombre = tu explores, blanc = tu es arrivé quelque part / tu lis ».
     LIGHT_OFFERED=true rendrait l'ancien comportement (préférence respectée) tel quel. */
  var LIGHT_OFFERED=false;
  try{
    var t=localStorage.getItem('monparis_theme'),r;
    if(!LIGHT_OFFERED)r='dark';
    else if(t==='light')r='light';
    else if(t==='system')r=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';

    document.documentElement.setAttribute('data-theme',r);

})();

<script>
/* 🍎 03/10/2026 — LE GESTE « TIRER POUR RÉVÉLER » (reprise d'inline-iphone.js, da-v15) : au sommet d'un écran ciel (Accueil · Spots ·

   --rv 0 → 1 sur 180 px de course (course morte 6 px), le contenu descend de 140 px (padding-top de .msp-tabwrap), ressort en 260 ms au
   relâcher. preventDefault sur le touchmove pris en main = le rebond natif iOS ne se superpose pas au geste ; le scroll normal est intact
   (le geste ne s'arme que si window.scrollY <= 0). Exposé pour les bancs : window.__mspSkyReveal(t), window.__mspSkyCSS(t). */
(function(){
  var R=[{"k":"rad","cx":50,"cy":-10,"rx":160,"ry":28,"st":[["#FF3D96",0,0],["#FF3D96",0,100]]},{"k":"rad","cx":50,"cy":-12,"rx":220,"ry":40,"st":[["#FF006E",0.42,0],["#FF006E",0.2,55],["#FF006E",0,100]]},{"k":"lin","st":[["#560B34",1,0],["#2B061A",1,31],["#000000",1,68]]}],P=[{"k":"rad","cx":50,"cy":-10,"rx":160,"ry":28,"st":[["#FF3D96",0.12,0],["#FF3D96",0,100]]},{"k":"rad","cx":50,"cy":-12,"rx":220,"ry":46,"st":[["#FF006E",0.5,0],["#FF006E",0.25,55],["#FF006E",0,100]]},{"k":"lin","st":[["#660D3B",1,0],["#310720",1,34],["#000000",1,74]]}];/* 08/10 chantier C : tiré = nappe 50 %, haut #660D3B, noir 74 % (décision №1 « courbe douce + amplitude réduite ») */
  var root=document.documentElement,G=null,RV=0,anim=0;
  function h2r(h){var n=parseInt(h.slice(1),16);return [(n>>16)&255,(n>>8)&255,n&255];}
  function mix(a,b,t){var A=h2r(a),B=h2r(b);return [A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t];}
  function col(c,a){var r=Math.round(c[0]),g=Math.round(c[1]),b=Math.round(c[2]);return a>=1?'rgb('+r+','+g+','+b+')':'rgba('+r+','+g+','+b+','+(+a.toFixed(3))+')';}
  function css(t){var out=[],stop=100;
    for(var i=0;i<R.length;i++){var a=R[i],b=P[i],st=[],vis=false;
      for(var j=0;j<a.st.length;j++){var s=a.st[j],q=b.st[j],al=s[1]+(q[1]-s[1])*t,pos=s[2]+(q[2]-s[2])*t;if(al>0)vis=true;st.push(col(mix(s[0],q[0],t),al)+' '+(+pos.toFixed(2))+'%');
        if(a.k==='lin'&&s[0]==='#000000')stop=pos;}
      if(a.k==='lin'){/* 08/10 : fondu sans coude — chaque segment est découpé en 6 sous-arrêts à pente en S (plus de bande de Mach au changement d'arrêt) */
        var S2=[];for(var j2=0;j2<a.st.length;j2++){var s0=a.st[j2],q0=b.st[j2],c0=mix(s0[0],q0[0],t),p0=s0[2]+(q0[2]-s0[2])*t;S2.push({c:c0,p:p0});}
        var E=[];for(var j3=0;j3<S2.length;j3++){E.push(col(S2[j3].c,1)+' '+(+S2[j3].p.toFixed(2))+'%');if(j3<S2.length-1){for(var m=1;m<6;m++){var f=m/6,g=f*f*(3-2*f);E.push(col([S2[j3].c[0]+(S2[j3+1].c[0]-S2[j3].c[0])*g,S2[j3].c[1]+(S2[j3+1].c[1]-S2[j3].c[1])*g,S2[j3].c[2]+(S2[j3+1].c[2]-S2[j3].c[2])*g],1)+' '+(+(S2[j3].p+(S2[j3+1].p-S2[j3].p)*f).toFixed(2))+'%');}}}
        out.push('linear-gradient(180deg,'+E.join(',')+')');}
      else if(vis){var cy=a.cy+(b.cy-a.cy)*t,rx=a.rx+(b.rx-a.rx)*t,ry=a.ry+(b.ry-a.ry)*t;out.push('radial-gradient('+(+rx.toFixed(2))+'% '+(+ry.toFixed(2))+'% at '+a.cx+'% '+(+cy.toFixed(2))+'%,'+st.join(',')+')');}}
    return {sky:out.join(','),mask:'linear-gradient(180deg,#000 0%,#000 '+Math.round(stop*.45)+'%,transparent '+(+stop.toFixed(2))+'%)'};}
  function clear(){root.style.removeProperty('--rv');root.style.removeProperty('--msp-sky');root.style.removeProperty('--msp-skym');RV=0;}
  function setRV(t){t=Math.max(0,Math.min(1,t));RV=t;if(t<=0.0005){clear();return;}var c=css(t);root.style.setProperty('--rv',t.toFixed(3));root.style.setProperty('--msp-sky',c.sky);root.style.setProperty('--msp-skym',c.mask);}
  function spring(){cancelAnimationFrame(anim);var from=RV,t0=performance.now();function step(now){var k=Math.min(1,(now-t0)/700);setRV(from*(1-k)*(1-k)*(1-k));/* 08/10 : retour 700 ms (ease-out cubique) au lieu de 260 ms */if(k<1)anim=requestAnimationFrame(step);}anim=requestAnimationFrame(step);}
  function actif(e){return root.getAttribute('data-sky')==='1'&&root.getAttribute('data-theme')==='dark'&&e.target&&e.target.closest&&!!e.target.closest('.msp-tabwrap')&&document.body.style.position!=='fixed'&&!e.target.closest('[role="dialog"],.ev-ov');}/* 07/10 : pas de « tirer pour révéler » sous une feuille/modale (body verrouillé) — il avalait tout glissé vers le bas dans la fiche event (scrollY=0 car body fixé) : impossible de remonter */
  document.addEventListener('touchstart',function(e){if(!actif(e)||window.scrollY>0||e.touches.length!==1)return;G={y:e.touches[0].clientY,on:false};cancelAnimationFrame(anim);},{passive:true});
  document.addEventListener('touchmove',function(e){if(!G)return;var dy=e.touches[0].clientY-G.y;
    if(!G.on){if(window.scrollY<=0&&dy>6)G.on=true;else return;}
    if(window.scrollY>0){G=null;spring();return;}
    if(e.cancelable)e.preventDefault();var u=Math.max(0,Math.min(1,(dy-6)/180));setRV(u*u*(3-2*u));},{passive:false});/* 08/10 : smoothstep (au lieu du linéaire) */
  function fin(){if(!G)return;var g=G;G=null;if(g.on)spring();}
  document.addEventListener('touchend',fin,{passive:true});document.addEventListener('touchcancel',fin,{passive:true});
  /* rastérisation des tuiles de grain : SVG → PNG (voir le commentaire CSS de --msp-g1). Pas de dépendance au DOM : <html> suffit. */
  function raster(prop,alpha,cible){cible=cible||prop;try{var v=getComputedStyle(root).getPropertyValue(prop).trim();var m=/^url\(\s*"?([\s\S]*?)"?\s*\)$/.exec(v);if(!m)return;var img=new Image();var d=Math.min(3,window.devicePixelRatio||1);
    img.onload=function(){try{var N=3,T=Math.round(160*d);var c=document.createElement('canvas');c.width=c.height=T*N;var x=c.getContext('2d');x.globalAlpha=alpha||1;for(var i=0;i<N;i++)for(var j=0;j<N;j++)x.drawImage(img,i*T,j*T,T,T);
      var fin=function(u){root.style.setProperty(cible,'url("'+u+'")');root.style.setProperty('--msp-gsz',(160*N)+'px');};
      if(c.toBlob)c.toBlob(function(bl){if(bl)fin(URL.createObjectURL(bl));},'image/png');else fin(c.toDataURL('image/png'));}catch(e){}};
    img.src=m[1];}catch(e){}}
  /* la feuille <style> qui porte --msp-g1/--msp-g2 est parsée APRÈS ce script : on rastérise au DOMContentLoaded (et tout de suite si déjà là) */

function rasterAll(){raster('--msp-g1-src',0.27,'--msp-g1');raster('--msp-g2');}
if(getComputedStyle(root).getPropertyValue('--msp-g1').trim())rasterAll();else document.addEventListener('DOMContentLoaded',rasterAll,{once:true});
window.__mspGrainRaster=rasterAll;
window.__mspSkyReset=function(){G=null;cancelAnimationFrame(anim);clear();};
window.__mspSkyReveal=setRV;window.__mspSkyCSS=css;
})();

.ev-tt{margin:0 0 4px;font:700 24px/1.15 var(--font-body);letter-spacing:-.5px;color:#FFFFFF}
.ev-wd{display:flex;align-items:center;gap:2px;margin:2px 0 6px -10px}
.ev-wd button{min-width:44px;height:44px;padding:0 10px;border:0;background:none;color:#C7C7CC;font:600 15px/1 var(--font-body);cursor:pointer}
.ev-wd button i{font-style:normal;display:inline-block;padding:4px 0 5px;border-bottom:2px solid transparent}
.ev-wd button.on{color:#FFFFFF;font-weight:700}
.ev-wd button.on i{border-bottom-color:#FFFFFF}
.ev-wd .dt{color:#636366}
.ev-inf{display:flex;gap:12px;align-items:flex-start;min-height:34px;padding:7px 0;font-size:14.5px;line-height:1.3;color:#FFFFFF}
.ev-inf small{display:block;color:#C7C7CC;font-size:12.5px;margin-top:1px}
.ev-i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ev-inf .ev-i{color:#C7C7CC;margin-top:1px}
.ev-dsc{color:#FFFFFF;font-size:14px;line-height:1.55;margin:12px 0 4px}
.ev-lk{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0;background:none;border:0;color:#FFFFFF;font:700 14px/1.2 var(--font-body);text-decoration:none;text-align:left;cursor:pointer}
.ev-lk .ev-i{width:16px;height:16px}
.ev-lk span{flex:0 1 auto}
.ev-gtl{font-size:11px;letter-spacing:.8px;font-weight:700;color:#C7C7CC;margin:16px 0 4px;text-transform:uppercase}
.ev-lr{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;border-bottom:1px solid #1C1C1E;font-size:16px;color:#FFFFFF}
.ev-lr b{font-weight:600;min-width:0;overflow-wrap:anywhere}
.ev-lr span{font-size:14px;color:#C7C7CC;flex:none}
.ev-sheet{overscroll-behavior:contain}.ev-ft{touch-action:none;position:relative;flex:none;display:flex;gap:8px;padding:8px 16px calc(10px + env(safe-area-inset-bottom,0px));background:#000;border-top:1px solid #1C1C1E;margin:0}
.ev-ft .ev-act .ev-i{width:16px;height:16px}
.ev-ft .ev-act--off{display:none}

.ev-ft::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:28px;background:linear-gradient(to bottom,rgba(0,0,0,0),#000);pointer-events:none}


.sd-sheet{--sd-desc-hl:rgba(255,0,110,.6)}
.sd-sheet .sd-desc{min-height:calc(var(--sd-lines,6) * var(--sd-lh,23.2px) + 28px)}
.sd-sheet .sd-desc.is-open{min-height:0}
.sd-sheet .sd-desc>p{font-size:var(--sd-fs,16px);line-height:var(--sd-lh,23.2px)}
.sd-sheet .sd-desc .sd-more{font-size:calc(var(--sd-fs,16px) * .8);line-height:var(--sd-lh,23.2px)}


.sdx-bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 38px);z-index:12;margin:6px -22px 8px;padding:0 22px;background:var(--bg-primary);border-bottom:1px solid var(--hairline)}
.sdx-strip{position:absolute;left:0;right:0;top:calc(-38px - env(safe-area-inset-top,0px));height:calc(38px + env(safe-area-inset-top,0px));background:var(--bg-primary);pointer-events:none;opacity:0;transition:opacity .15s}
.sdx-bar.is-stuck .sdx-strip{opacity:1}
.sdx-head{display:flex;align-items:center;gap:8px;min-height:54px;width:100%;background:none;border:0;padding:0;color:var(--ink-900);font-family:var(--font-body);font-size:15px;font-weight:700;text-align:left;cursor:pointer}
.sdx-line{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sdx-st--open{color:var(--open)}.sdx-st--closed{color:#FF6B6B}.sdx-st--unknown{color:var(--ink-400)}
.sdx-chev{flex:none;width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--hairline);display:flex;align-items:center;justify-content:center;color:var(--ink-900);transition:transform .2s,background .2s}
.sdx-chev.on{transform:rotate(180deg);background:var(--ink-900);color:var(--bg-primary)}
.sdx-drawer{position:absolute;left:0;right:0;top:100%;background:var(--bg-primary);padding:10px 16px 16px;border-bottom:1px solid var(--hairline);box-shadow:0 24px 30px rgba(0,0,0,.55);max-height:calc(100dvh - 124px - env(safe-area-inset-top,0px));overflow-y:auto;overscroll-behavior:contain;border-radius:0 0 22px 22px}
.sdx-cols{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-items:start}
.sdx-card{min-width:0;background:var(--card);border-radius:14px;padding:12px 12px 8px;border:1px solid var(--hairline)}
.sdx-card h4{margin:0 0 4px;font-family:var(--font-body);font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-400)}
.sdx-li{display:flex;align-items:flex-start;gap:9px;min-height:34px;padding:6px 0;width:100%;font-family:var(--font-body);font-size:14px;font-weight:600;line-height:1.25;color:var(--ink-900);text-decoration:none;background:none;border:0;text-align:left;cursor:pointer;box-sizing:border-box}
.sdx-li .ic{flex:none;margin-top:0;opacity:.8}
.sdx-li .t{min-width:0;flex:1;overflow-wrap:anywhere}
.sdx-li .sd-go{margin-left:auto;flex:none;color:var(--pop-pink);font-weight:900}
.sdx-li.muted,.sdx-li.muted .t{color:var(--ink-400);cursor:default}
.sdx-sel,.sdx-sel .t{-webkit-user-select:text;user-select:text;cursor:text}
.sdx-week{margin-top:6px;background:var(--card);border-radius:14px;border:1px solid var(--hairline);overflow:hidden}
.sdx-weekhd{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:44px;padding:0 14px;background:none;border:0;color:var(--ink-900);font-family:var(--font-body);font-size:14px;font-weight:700;cursor:pointer}
.sdx-chv{display:flex;transition:transform .2s}.sdx-chv.on{transform:rotate(180deg)}
.sdx-weekbd{padding:0 14px 8px}
.sdx-day{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:13.5px;font-weight:500;color:var(--ink-900);border-top:1px solid var(--hairline)}
.sdx-day span:last-child{text-align:right}
.sdx-day.cur{font-weight:800;color:var(--pop-pink)}

.sd-fchip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:rgba(0,0,0,.5);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;font:700 13px var(--font-body);white-space:nowrap;margin:0;-webkit-tap-highlight-color:transparent}
.sd-fchip i{width:8px;height:8px;border-radius:50%;display:block;flex:none}

.sd-fchip[data-sd="pill-state"]{position:relative;align-self:center;height:21px;padding:0 8.4px;gap:4.2px;font-size:9.1px}
.sd-fchip[data-sd="pill-state"] i{width:5.6px;height:5.6px}
.sd-fchip[data-sd="pill-state"]::after{content:'';position:absolute;inset:-12px -8px}
.sdx-bar{margin:-6px -22px 4px}
.sdx-head{min-height:56px}
.sdx-chev{width:52px;height:52px}
.sdx-chev svg{width:26px;height:26px}
.sdx-cols{align-items:stretch;gap:10px}
.sdx-cols>.sdx-card{display:block}
.sdx-col2{display:flex;flex-direction:column;min-width:0}
.sdx-card--r{flex:1 1 auto;border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom:0}
.sdx-card{border-radius:18px;padding:14px 13px 6px}
.sdx-card--r{border-radius:18px 18px 0 0}
.sdx-addr{min-height:calc(2 * 1.25em + 12px)}
.sdx-addr .t{font-size:13.5px;line-height:1.25}
.sdx-pills{display:flex;gap:5px;background:var(--card);border:1px solid var(--hairline);border-top:0;border-radius:0 0 18px 18px;padding:8px 8px 10px}
.sdx-pills button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;border:1px solid var(--hairline);background:var(--bg-primary);color:var(--ink-900);border-radius:12px;padding:8px 0;font:700 10.5px var(--font-body);letter-spacing:-.02em;cursor:pointer;white-space:nowrap}
.sdx-pills b{font-size:17px;font-weight:400;line-height:1.1}
.sdx-weekbd--in{padding:0 0 6px 27px}
.sdx-weekbd--in .sdx-day{font-size:12px;padding:3px 0;gap:6px}

.sdx-bar{border-bottom:0}
.sdx-head{min-height:39px;font-size:11.5px}
.sdx-chev{width:36px;height:36px}
.sdx-chev svg{width:18px;height:18px}

</style>
</head>

<script>
// 🔄 SW + mise à jour in-app : le SW fait déjà skipWaiting+claim, donc quand une nouvelle
// version s'active pendant que la page est ouverte → controllerchange → bannière « Mettre à jour »
// (un reload suffit, le HTML est network-first). reg.update() est forcé à chaque retour au premier
// plan car iOS PWA ne vérifie presque jamais tout seul — fini les 2 force-quits.
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then((reg) => {
      let last = 0;
      const check = () => { const now = Date.now(); if (now - last > 60000) { last = now; reg.update().catch(() => {}); } };
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
      window.addEventListener('focus', check);
      setInterval(check, 30 * 60000);
    }).catch(() => {});
    let hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController) { hadController = true; return; } // toute première installation : rien à recharger
      if (document.getElementById('msp-update-banner')) return;
      const b = document.createElement('div');
      b.id = 'msp-update-banner';
      b.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:9000;display:flex;align-items:center;gap:12px;background:#171726;color:#fff;padding:10px 12px 10px 18px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.35);font-family:system-ui,-apple-system,sans-serif;font-size:14px;font-weight:600;max-width:92vw;white-space:nowrap;';
      const label = document.createElement('span');
      label.textContent = '✨ Nouvelle version dispo';
      const btn = document.createElement('button');
      btn.textContent = 'Mettre à jour';
      btn.style.cssText = 'border:none;border-radius:999px;padding:9px 15px;background:#2C2C2E;color:#fff;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit;flex-shrink:0;';
      btn.onclick = () => { b.remove(); location.reload(); };
      b.appendChild(label); b.appendChild(btn);
      document.body.appendChild(b);
    });
  });
}
</script>
