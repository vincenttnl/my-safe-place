*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg-primary:#FFFFFF;--bg-cream:#FFF8EC;--bg-soft:#F5F2EB;
  --ink-900:#0A0A0A;--ink-600:#3A3A3A;--ink-400:#7A7A7A;--hairline:#E8E4DB;
  --pop-pink:#FF3D8B;--pop-magenta:#E91E63;--pop-orange:#FF6B2C;--pop-yellow:#FFD23F;--pop-lime:#C6FF3D;--pop-violet:#8B5CF6;--pop-cyan:#3DC8FF;
  --font-display:"Fraunces",Georgia,serif;--font-body:"Inter",system-ui,sans-serif;--font-mono:"JetBrains Mono",monospace;
  --radius-sm:8px;--radius-md:16px;--radius-lg:24px;--radius-pill:999px;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.04);--shadow-md:0 8px 24px rgba(0,0,0,0.08);--shadow-lg:0 24px 48px rgba(0,0,0,0.12);--shadow-pop:0 12px 32px rgba(255,61,139,0.25);
  --ease:cubic-bezier(0.4,0,0.2,1);
  /* legacy compat */
  --bg:var(--bg-primary);--card:#fff;--text:var(--ink-900);--muted:var(--ink-400);--border:var(--hairline);--soft:var(--bg-soft);--input:#fff;--nav:#fff;--nav-border:var(--hairline);--accent:var(--pop-pink);--radius:var(--radius-md);
}

body.dark{
  --bg-primary:#0E0E0E;--bg-cream:#1A1710;--bg-soft:#151510;--ink-900:#F0EBE0;--ink-600:#B0A890;--ink-400:#706858;--hairline:#2A2620;
  --bg:var(--bg-primary);--card:#1c1c1e;--text:var(--ink-900);--muted:var(--ink-400);--border:var(--hairline);--soft:var(--bg-soft);--input:#1c1c1e;--nav:#1A1710;--nav-border:var(--hairline);--accent:var(--pop-pink);
}

html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{background:var(--bg-primary);color:var(--ink-900);font-family:var(--font-body);font-size:15px;line-height:1.55;min-height:100vh;transition:background .3s,color .3s;padding-bottom:80px}
textarea,input,select{font-family:var(--font-body);background:var(--input);color:var(--ink-900);border-color:var(--hairline)}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#ccc;border-radius:4px}
body.dark ::-webkit-scrollbar-thumb{background:#555}

.leaflet-popup-content-wrapper{border-radius:var(--radius-md);box-shadow:var(--shadow-md)}
.leaflet-popup-content{margin:10px 14px;font-family:var(--font-body)}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(100%)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

.fade-in{animation:fadeIn .3s ease-out both}
.slide-up{animation:slideUp .35s var(--ease) both}
.press{transition:transform .12s ease;cursor:pointer}
.press:active{transform:scale(.96)}

/* Bottom nav - Partiful style */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--hairline);display:flex;justify-content:space-around;padding:6px 0 env(safe-area-inset-bottom,8px);z-index:90}
body.dark .bottom-nav{background:rgba(26,23,16,0.92)}
.bottom-nav button{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;cursor:pointer;padding:4px 12px;font-size:10px;font-weight:600;font-family:var(--font-body);color:var(--ink-400);transition:color .2s}
.bottom-nav button.active{color:var(--ink-900)}
.bottom-nav button .nav-icon{font-size:22px;line-height:1;transition:all .2s var(--ease)}
.bottom-nav button.active .nav-icon{filter:none;opacity:1;transform:scale(1.08) rotate(-4deg)}
.bottom-nav button:not(.active) .nav-icon{filter:grayscale(0.8);opacity:0.55}

/* Section titles - Partiful */
.section-title{font-family:var(--font-display);font-weight:900;font-size:28px;letter-spacing:-0.015em;color:var(--ink-900);line-height:1.05}
.section-sub{font-family:var(--font-body);font-size:13px;color:var(--ink-400);margin-top:4px}
.mono-label{font-family:var(--font-mono);font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:var(--ink-400)}

/* Category grid - Partiful */
.cat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.cat-card{display:flex;flex-direction:column;align-items:flex-start;padding:14px 10px;border-radius:var(--radius-md);cursor:pointer;transition:all .2s var(--ease);text-align:left;border:none;background:transparent}
.cat-card:active{transform:scale(.97)}
.cat-card .cat-emoji{font-size:28px;margin-bottom:6px}
.cat-card .cat-name{font-family:var(--font-body);font-weight:700;font-size:14px;color:var(--ink-900)}
.cat-card .cat-count{font-family:var(--font-mono);font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:var(--ink-600);margin-top:2px}

/* Spot cards */
.spot-card-v2{background:var(--card);border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm);transition:transform .2s var(--ease),box-shadow .2s var(--ease);cursor:pointer;border:1px solid var(--hairline)}
.spot-card-v2:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.spot-card-v2:active{transform:scale(.98)}
.spot-card-v2 .card-photo{width:100%;height:160px;object-fit:cover;background:var(--bg-soft)}
.spot-card-v2 .card-body{padding:14px 16px}
.spot-card-v2 .card-name{font-family:var(--font-body);font-weight:600;font-size:16px;color:var(--ink-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.spot-card-v2 .card-meta{font-family:var(--font-body);font-size:12.5px;color:var(--ink-400);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:var(--radius-pill);font-size:11px;font-weight:600;font-family:var(--font-body);white-space:nowrap}

/* Modal overlay - Partiful */
.modal-overlay{position:fixed;inset:0;background:rgba(10,10,10,0.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal-sheet{background:var(--bg-primary);border-radius:24px 24px 0 0;width:100%;max-width:600px;max-height:94vh;overflow:auto;padding:20px 22px calc(20px + env(safe-area-inset-bottom,0px))}
body.dark .modal-sheet{background:var(--bg-cream)}
.modal-sheet .sheet-handle{width:46px;height:5px;border-radius:var(--radius-pill);background:var(--hairline);margin:0 auto 16px}
.modal-center{position:fixed;inset:0;background:rgba(10,10,10,0.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-center .modal-box{background:var(--bg-primary);border-radius:var(--radius-lg);width:100%;max-width:440px;max-height:90vh;overflow:auto;padding:24px;box-shadow:var(--shadow-lg)}
body.dark .modal-center .modal-box{background:var(--bg-cream)}

/* Pill buttons - Partiful */
.pill-btn{padding:8px 14px;border-radius:var(--radius-pill);border:1px solid var(--hairline);background:#fff;cursor:pointer;font-size:13px;font-weight:500;font-family:var(--font-body);color:var(--ink-900);transition:all .15s var(--ease)}
body.dark .pill-btn{background:var(--bg-soft)}
.pill-btn.active{border-color:var(--ink-900);background:var(--ink-900);color:#fff}
.pill-btn:active{transform:scale(.95)}

/* Inputs - Partiful */
.input-v2{width:100%;padding:12px 16px;border-radius:var(--radius-md);border:1.5px solid var(--hairline);font-size:15px;outline:none;background:#fff;font-family:var(--font-body);color:var(--ink-900);transition:border-color .2s var(--ease)}
body.dark .input-v2{background:var(--bg-soft)}
.input-v2:focus{border-color:var(--pop-pink)}

/* Buttons - Partiful */
.btn-primary{width:100%;padding:16px;border-radius:var(--radius-pill);border:none;background:var(--ink-900);color:#fff;font-weight:600;cursor:pointer;font-size:16px;font-family:var(--font-body);transition:all .15s var(--ease);box-shadow:var(--shadow-pop)}
.btn-primary:active{opacity:.85;transform:scale(.98)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-secondary{width:100%;padding:14px;border-radius:var(--radius-pill);border:1px solid var(--hairline);background:#fff;color:var(--ink-900);font-weight:600;cursor:pointer;font-size:15px;font-family:var(--font-body)}
body.dark .btn-secondary{background:var(--bg-soft)}

.stat-pill{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:var(--radius-pill);background:var(--bg-cream);border:1px solid var(--hairline);font-size:13px;font-weight:500;font-family:var(--font-body);color:var(--ink-900)}

.h-scroll{display:flex;gap:12px;overflow-x:auto;padding:4px 0;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none}
.h-scroll::-webkit-scrollbar{display:none}
.h-scroll>*{scroll-snap-align:start;flex-shrink:0}
</style>

function detectDept(s){
  const addr=s.adresse||"";const m=addr.match(/\b(\d{5})\b/);
  if(m){const cp=m[1];if(cp.startsWith("75")){const num=parseInt(cp.slice(2),10);if(num>=1&&num<=20)return`75-${num}`;return"75-1";}const pref=cp.slice(0,2);if(["77","78","91","92","93","94","95"].includes(pref))return pref;}
  if(/Issy|Boulogne|Neuilly|Levallois|Clichy-la|Meudon|Saint-Cloud/i.test(addr))return"92";
  if(/Saint-Denis|Montreuil|Pantin|Bobigny/i.test(addr))return"93";
  if(/Versailles|Saint-Germain|Yvelines|Poissy|Mantes/i.test(addr))return"78";
  if(/Cergy|Pontoise|Argenteuil/i.test(addr))return"95";
  if(/Paris/i.test(addr)||/,\s*750/i.test(addr))return"75-1";
  return null;
}
function matchesZones(spot,zoneList){if(!zoneList||zoneList.length===0)return true;const dept=detectDept(spot);if(!dept)return true;if(zoneList.includes(dept))return true;if(dept.startsWith("75-")&&zoneList.includes("75"))return true;return false;}
function hasCat(s,c){return Array.isArray(s.cats)?s.cats.includes(c):s.cat===c;}
function getCats(s){return Array.isArray(s.cats)?s.cats:(s.cat?[s.cat]:["sortie"]);}
function primaryCat(s){return getCats(s)[0]||"sortie";}
function pickChallenge(spots){const todo=[...spots.filter(s=>!s.done&&s.status!=="rejected")].sort(()=>Math.random()-0.5);return todo.slice(0,Math.min(3,todo.length)).map(s=>s.id);}
function getMonthLabel(){return new Date().toLocaleDateString("fr-FR",{month:"long",year:"numeric"});}
function scoreSpot(s,a){if(!s.tags)return 0;let score=0;if(a.who&&s.tags.who?.includes(a.who))score+=3;if(a.when&&s.tags.when?.includes(a.when))score+=3;if(a.vibe&&s.tags.vibe?.includes(a.vibe))score+=3;if(a.cuisine&&s.tags.cuisine?.includes(a.cuisine))score+=4;if(a.work&&s.tags.work)score+=4;if(a.zone){if(s.tags.zone===a.zone)score+=2;else score-=1;}if(a.budget&&s.price&&s.price.toLowerCase().includes(a.budget.toLowerCase()))score+=2;return score;}
function parseDiscover(q){const words=q.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").split(/[\s,.']+/).filter(Boolean);let amenity=null,cuisine=null,bbox=[48.10,1.40,49.25,3.55],nameTerms=[];for(const w of words){if(DA[w]&&!amenity)amenity=DA[w];else if(DC[w]&&!cuisine)cuisine=DC[w];else if(w==="paris")bbox=DEPT_BB["75"];else if(/^\d{5}$/.test(w)){const d=w.slice(0,2);if(DEPT_BB[d])bbox=DEPT_BB[d];}else if(DEPT_BB[w])bbox=DEPT_BB[w];else if(!STOP_W.has(w)&&w.length>2)nameTerms.push(w);}if(!amenity&&cuisine)amenity="restaurant";if(!amenity&&nameTerms.length===0)amenity="restaurant";return{amenity,cuisine,bbox,nameTerms};}
function buildOPQuery({amenity,cuisine,bbox,nameTerms}){const bb=`${bbox[0]},${bbox[1]},${bbox[2]},${bbox[3]}`;let parts=[];if(amenity==="nightclub"){parts.push(`node["amenity"~"nightclub|bar"](${bb})`);parts.push(`way["amenity"~"nightclub|bar"](${bb})`);if(cuisine){parts.push(`node["amenity"="restaurant"]["cuisine"~"${cuisine}",i](${bb})`);parts.push(`way["amenity"="restaurant"]["cuisine"~"${cuisine}",i](${bb})`);}}else{let f=amenity?`["amenity"="${amenity}"]`:`["amenity"~"restaurant|cafe|bar|pub|nightclub|fast_food"]`;if(cuisine)f+=`["cuisine"~"${cuisine}",i]`;if(nameTerms.length>0)f+=`["name"~"${nameTerms.join("|")}",i]`;parts.push(`node${f}(${bb})`);parts.push(`way${f}(${bb})`);}return`[out:json][timeout:12];(${parts.join(";")};);out center 80;`;}
function scoreOPResult(el){const t=el.tags||{};let s=0;if(t.name)s+=3;if(t.cuisine)s+=1;if(t.opening_hours)s+=2;if(t.website||t["contact:website"])s+=1;if(t.phone||t["contact:phone"])s+=1;if(t["addr:street"])s+=1;return s;}

async function googlePlacePhotos(name,address,apiKey,count=4){
  if(!apiKey)return[];
  try{
    const q=(name+" "+(address||"Paris")).trim();
    const r=await fetch("https://places.googleapis.com/v1/places:searchText",{method:"POST",headers:{"Content-Type":"application/json","X-Goog-Api-Key":apiKey,"X-Goog-FieldMask":"places.photos,places.displayName"},body:JSON.stringify({textQuery:q,languageCode:"fr",maxResultCount:1})});
    if(!r.ok)return[];
    const d=await r.json();
    const place=d.places?.[0];if(!place?.photos?.length)return[];
    return place.photos.slice(0,count).map(p=>`https://places.googleapis.com/v1/${p.name}/media?maxHeightPx=800&maxWidthPx=800&key=${apiKey}`);
  }catch{return[];}
}
function getPhotos(s){if(Array.isArray(s.photos)&&s.photos.length)return s.photos;if(s.photo)return[s.photo];return[];}
function firstPhoto(s){const p=getPhotos(s);return p[0]||"";}
function distKm(lat1,lng1,lat2,lng2){
  const R=6371;const dLat=(lat2-lat1)*Math.PI/180;const dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function AddressAutocomplete({value,onChange,onPick,placeholder}){
  const [sugg,setSugg]=useState([]);const [focused,setFocused]=useState(false);const abortRef=useRef(null);const tRef=useRef(null);
  const fetchSugg=(q)=>{if(abortRef.current)abortRef.current.abort();if(!q||q.trim().length<3){setSugg([]);return;}const ctrl=new AbortController();abortRef.current=ctrl;fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=5&lang=fr&bbox=2.20,48.70,2.50,48.95`,{signal:ctrl.signal}).then(r=>r.json()).then(d=>setSugg(d.features||[])).catch(e=>{if(e.name!=="AbortError")console.warn(e);});};
  const handleChange=(v)=>{onChange(v);if(tRef.current)clearTimeout(tRef.current);tRef.current=setTimeout(()=>fetchSugg(v),300);};
  const format=(f)=>{const p=f.properties;const parts=[];if(p.housenumber)parts.push(p.housenumber);if(p.street)parts.push(p.street);else if(p.name)parts.push(p.name);const line1=parts.join(" ");const line2=[p.postcode,p.city].filter(Boolean).join(" ");return{adresse:[line1,line2].filter(Boolean).join(", "),lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0],label:line1||p.name||"—",sub:line2};};
  return(
    <div style={{position:"relative",marginBottom:8}}>
      <input value={value} onChange={e=>handleChange(e.target.value)} onFocus={()=>setFocused(true)} onBlur={()=>setTimeout(()=>setFocused(false),200)} placeholder={placeholder} className="input-v2"/>
      {focused&&sugg.length>0&&(
        <div style={{position:"absolute",top:"100%",left:0,right:0,marginTop:4,background:"#fff",border:"1px solid var(--hairline)",borderRadius:'var(--radius-md)',boxShadow:"var(--shadow-lg)",zIndex:20,maxHeight:260,overflowY:"auto"}}>
          {sugg.map((f,i)=>{const o=format(f);return(
            <div key={i} onMouseDown={()=>{onPick(o);setSugg([]);}} style={{padding:"10px 14px",cursor:"pointer",borderBottom:i<sugg.length-1?"1px solid var(--hairline)":"none"}}>
              <div style={{fontFamily:'var(--font-body)',fontWeight:600,fontSize:14}}>📍 {o.label}</div>
              {o.sub&&<div style={{fontSize:12,color:"var(--ink-400)",marginTop:2}}>{o.sub}</div>}
            </div>
          );})}
        </div>
      )}
    </div>
  );
}

/* =============================================
   PHOTO CAROUSEL - Partiful style
   ============================================= */
function PhotoCarousel({photos,catColor}){
  const [idx,setIdx]=useState(0);
  const touchRef=useRef({x:0,y:0,swiping:false});
  if(!photos||photos.length===0)return null;
  const go=(dir)=>{const next=idx+dir;if(next>=0&&next<photos.length)setIdx(next);};
  const onTouchStart=(e)=>{touchRef.current={x:e.touches[0].clientX,y:e.touches[0].clientY,swiping:true};};
  const onTouchEnd=(e)=>{if(!touchRef.current.swiping)return;const dx=e.changedTouches[0].clientX-touchRef.current.x;const dy=e.changedTouches[0].clientY-touchRef.current.y;touchRef.current.swiping=false;if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>40){dx<0?go(1):go(-1);}};
  const handleTap=(e)=>{const rect=e.currentTarget.getBoundingClientRect();const x=e.clientX-rect.left;if(x<rect.width*0.3)go(-1);else if(x>rect.width*0.7)go(1);};
  return(
    <div style={{position:"relative",overflow:"hidden",aspectRatio:'4/3',background:catColor||'var(--bg-soft)'}}
      onTouchStart={onTouchStart} onTouchEnd={onTouchEnd} onClick={handleTap}>
      <div style={{display:"flex",transition:"transform .35s var(--ease)",transform:`translateX(-${idx*100}%)`}}>
        {photos.map((url,i)=>(
          <div key={i} style={{minWidth:"100%",height:"100%",aspectRatio:'4/3',backgroundSize:"cover",backgroundPosition:"center",background:`url(${url}) center/cover no-repeat, var(--bg-soft)`}}/>
        ))}
      </div>
      {photos.length>1&&(
        <>
          <div style={{position:"absolute",bottom:14,left:'50%',transform:'translateX(-50%)',display:"flex",gap:6}}>
            {photos.map((_,i)=>(
              <div key={i} style={{width:idx===i?22:6,height:6,borderRadius:999,background:'#fff',opacity:idx===i?1:0.5,transition:"all .3s var(--ease)",cursor:"pointer"}} onClick={(e)=>{e.stopPropagation();setIdx(i);}}/>
            ))}
          </div>
          <div style={{position:"absolute",top:14,left:14,background:"rgba(0,0,0,0.6)",backdropFilter:"blur(8px)",borderRadius:6,padding:"4px 8px",fontFamily:'var(--font-mono)',fontSize:10,letterSpacing:'0.1em',fontWeight:700,color:"#fff"}}>{idx+1}/{photos.length}</div>
        </>
      )}
    </div>
  );
}

            <div style={{flex:1}}>
              <div style={{fontFamily:'var(--font-body)',fontWeight:600,fontSize:14.5}}>Importer un JSON</div>
              <div style={{fontFamily:'var(--font-body)',fontSize:12,color:'var(--ink-400)',marginTop:2}}>Fusionner ou remplacer</div>
            </div>
            <div style={{color:'var(--ink-400)',fontSize:18}}>›</div>
            <input type="file" accept=".json" onChange={e=>{if(e.target.files[0]){importJSON(e.target.files[0]);e.target.value="";}}} style={{display:"none"}}/>
          </label>
        </div>
      </div>

      {/* Google Places API key */}
      <div style={{padding:'14px 20px 0'}}>
        <div style={{background:'#fff',border:'1px solid var(--hairline)',borderRadius:'var(--radius-md)',padding:16}}>
          <div style={{fontFamily:'var(--font-body)',fontWeight:700,fontSize:15,marginBottom:4}}>📷 Google Places — Photos</div>
          <div style={{fontSize:12,color:'var(--ink-400)',marginBottom:10,fontFamily:'var(--font-body)'}}>Remplis automatiquement les photos via Google</div>
          <input value={gApiKey} onChange={e=>setGApiKey(e.target.value)} placeholder="Colle ta cle API Google ici" className="input-v2" style={{marginBottom:10,fontSize:13}} type="password"/>
          <button onClick={fetchAllPhotos} disabled={photoLoading||!gApiKey} className="btn-primary" style={{fontSize:13}}>{photoLoading?"⏳ En cours...":"📷 Recuperer toutes les photos"}</button>
          {photoProgress&&<div style={{fontSize:12,color:'var(--pop-pink)',marginTop:8,textAlign:'center',fontWeight:600,fontFamily:'var(--font-body)'}}>{photoProgress}</div>}
          <div style={{fontSize:11,color:'var(--ink-400)',marginTop:8,fontFamily:'var(--font-body)'}}>{spots.filter(s=>getPhotos(s).length===0).length} spot{spots.filter(s=>getPhotos(s).length===0).length>1?"s":""} sans photo</div>
        </div>
      </div>

      {/* Trash */}
      {trash.length>0&&(
        <div style={{padding:'14px 20px 0'}}>
          <div style={{background:'#fff',border:'1px solid var(--hairline)',borderRadius:'var(--radius-md)',padding:16}}>
            <div style={{fontFamily:'var(--font-body)',fontWeight:700,fontSize:15,marginBottom:12}}>🗑️ Corbeille</div>
            <div style={{display:'flex',flexDirection:'column',gap:6}}>
              {trash.slice(0,5).map(t=>{
                const days=Math.max(0,Math.ceil((t.deletedAt+TRASH_DAYS*864e5-Date.now())/864e5));
                return(
                  <div key={t.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 10px',background:'var(--bg-soft)',borderRadius:10}}>
                    <div style={{fontFamily:'var(--font-body)',fontSize:13,fontWeight:600}}>{t.name}<span style={{fontSize:11,color:'var(--ink-400)',marginLeft:6}}>⏳ {days}j</span></div>
                    <div style={{display:'flex',gap:6}}>
                      <button onClick={()=>restoreSpot(t.id)} className="press" style={{padding:'4px 10px',borderRadius:8,border:'none',background:'#d1fae5',color:'#065f46',fontWeight:700,fontSize:12}}>↩️</button>
                      <button onClick={()=>{if(confirm(`Supprimer definitivement "${t.name}" ?`))setTrash(tr=>tr.filter(x=>x.id!==t.id));}} className="press" style={{padding:'4px 10px',borderRadius:8,border:'none',background:'#fee2e2',color:'#991b1b',fontWeight:700,fontSize:12}}>🗑</button>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}

      {/* Contacts bubbles */}
      <div style={{padding:'24px 20px 0'}}>
        <div className="mono-label" style={{marginBottom:10}}>Tes potes</div>
        <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
          {contacts.map(c=>(
            <div key={c.id} style={{display:'flex',alignItems:'center',gap:8,background:'#fff',border:'1px solid var(--hairline)',borderRadius:999,padding:'6px 14px 6px 6px',boxShadow:'var(--shadow-sm)'}}>
              <div style={{width:30,height:30,borderRadius:999,background:c.color,display:'flex',alignItems:'center',justifyContent:'center',fontSize:15}}>{c.emoji}</div>
              <div style={{fontFamily:'var(--font-body)',fontWeight:600,fontSize:13.5}}>{c.name}</div>
            </div>
          ))}
          <button onClick={()=>setShowContacts(true)} style={{display:'flex',alignItems:'center',gap:8,background:'transparent',border:'1.5px dashed var(--hairline)',borderRadius:999,padding:'6px 14px 6px 6px',cursor:'pointer'}}>
            <div style={{width:30,height:30,borderRadius:999,background:'var(--bg-soft)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,color:'var(--ink-400)'}}>+</div>
            <div style={{fontFamily:'var(--font-body)',fontWeight:500,fontSize:13.5,color:'var(--ink-400)'}}>Ajouter</div>
          </button>
        </div>
      </div>

      <div style={{textAlign:'center',fontSize:12,color:'var(--ink-400)',marginTop:24,paddingBottom:16,fontFamily:'var(--font-body)'}}>💾 Sauvegarde auto dans le navigateur</div>
    </div>
  );};

  /* =============================================
     RENDER
     ============================================= */
  return(
    <div style={{maxWidth:600,margin:"0 auto",minHeight:"100vh"}}>
      {(showZones||!zones)&&<ZonesModal zones={zones||{resto:[],sortie:[]}} isOnboarding={!zones} onClose={()=>setShowZones(false)} onSave={z=>{setZones(z);setShowZones(false);}}/>}
      {showSuggest&&<SuggestModal spots={spots} onClose={()=>setShowSuggest(false)} onPick={s=>setSelectedSpot(s)} onStatus={setStatus} onDone={markDone}/>}
      {showContacts&&<ContactsModal contacts={contacts} onAdd={addContact} onUpdate={updateContact} onDelete={deleteContact} onClose={()=>setShowContacts(false)}/>}
      {contactPickerFor&&<ContactPicker spot={spots.find(s=>s.id===contactPickerFor)||{}} contacts={contacts} onToggle={cid=>toggleContactOnSpot(contactPickerFor,cid)} onClose={()=>setContactPickerFor(null)} onOpenContacts={()=>{setContactPickerFor(null);setShowContacts(true);}}/>}
      {reactionSpot&&<ReactionModal spot={reactionSpot} onSave={(e,n)=>saveReaction(reactionSpot.id,e,n)} onSkip={()=>setReactionSpot(null)}/>}
      {selectedSpot&&<SpotDetail spot={spots.find(s=>s.id===selectedSpot.id)||selectedSpot} contacts={contacts} onClose={()=>setSelectedSpot(null)} onDone={markDone} onFav={toggleFav} onStatus={setStatus} onRemove={removeSpot} onEdit={startEdit} onContactPicker={id=>{setSelectedSpot(null);setContactPickerFor(id);}} onNote={saveNote}/>}

      <div style={{paddingBottom:20}}>
        {tab==="home"&&<HomeTab/>}
        {tab==="spots"&&<SpotsTab/>}
        {tab==="events"&&<EventsTab/>}
        {tab==="map"&&<MapTab/>}
        {tab==="profile"&&<ProfileTab/>}
      </div>

      <nav className="bottom-nav">
        {[
          {key:"home",icon:"🏠",label:"Accueil"},
          {key:"spots",icon:"📍",label:"Spots"},
          {key:"events",icon:"🎫",label:"Events"},
          {key:"map",icon:"🗺️",label:"Carte"},
          {key:"profile",icon:"⚙️",label:"Profil"},
        ].map(t=>(
          <button key={t.key} className={tab===t.key?"active":""} onClick={()=>setTab(t.key)}>
            <span className="nav-icon">{t.icon}</span>
            {t.label}
          </button>
        ))}
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
