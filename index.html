/* ===================================================================
   🎬 .sd-act — v382, SÉRIE ④ VARIANTE №11 « STYLE AFFICHE » (choix Vincent 04/08)
   Les 3 actions du bas de fiche (Maps · Ajouter · Partager) prennent la DA sticker
   de l'app : contour épais + ombre portée franche, comme les cartes de l'Accueil.
   En classe CSS et pas en style inline, parce que le contour ET l'ombre changent
   entre Jour et Nuit : c'est le seul endroit où on peut le dire une fois pour les deux.
   Géométrie figée par la variante : flex:1 · radius 14 · padding 13px · 13.5px.
   ⚠️ PAS d'overflow:hidden ici : on ne cache jamais un texte coupé, on le fait tenir.
   Le débordement a d'abord été réglé par la TAILLE (11,5 px sur le seul état
   « déjà ajouté »), puis supprimé à la source le 04/08 : Vincent a tranché pour
   « ✓ Ajouté » plutôt que « ✓ Dans tes spots », donc les TROIS boutons gardent
   la même taille. La classe .sd-act--long n'a plus lieu d'être.
   =================================================================== */
.sd-act{flex:1;min-width:0;display:inline-flex;align-items:center;justify-content:center;gap:5px;
  padding:13px 4px;border-radius:14px;cursor:pointer;text-align:center;
  font-family:var(--font-body);font-weight:700;font-size:var(--sd-act-fs,13.5px);line-height:1.15;
  letter-spacing:-.15px;white-space:nowrap;
  background:#FFFFFF;color:#0A0A0A;border:2px solid #0A0A0A;box-shadow:3px 4px 0 rgba(10,10,10,.85)}
:root[data-theme="dark"] .sd-act:not(.surface-light *){background:#181022;color:#F4EFFA;
  border-color:rgba(255,255,255,.5);box-shadow:3px 4px 0 rgba(0,0,0,.7)}
/* la seule pastille pleine : Ajouter. Le contour reste — c'est lui qui fait l'affiche. */
.sd-act--add,:root[data-theme="dark"] .sd-act--add{background:#FF006E;color:#fff}
/* 📏 v383 — le libellé long est SUPPRIMÉ, pas rapetissé (décision Vincent 04/08).
   Historique, pour ne pas refaire le chemin : « ✓ Dans tes spots » réclamait 95,3 px dans un
   tiers de rangée qui en offre 97 à 390 px de viewport. On l'avait fait tenir en descendant
   ce seul bouton à 11,5 px — il restait 5,8 px de marge, et 2 px d'écart avec ses voisins.
   Vincent a préféré raccourcir le texte : « ✓ Ajouté » / « ✓ Added » / « ✓ Añadido ».
   Les TROIS boutons partagent donc à nouveau la même taille, avec ~30 px de marge.
   Si un jour un libellé rallonge, on raccourcit le texte — on ne rétrécit pas un bouton sur trois. */

/* Modal overlay - Partiful */
.modal-overlay{position:fixed;inset:0;background:rgba(10,10,10,0.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal-sheet{position:relative;background:var(--bg-primary);border-radius:24px 24px 0 0;width:100%;max-width:600px;max-height:94vh;overflow:auto;padding:20px 22px calc(20px + env(safe-area-inset-bottom,0px))}
.modal-sheet .sheet-handle{display:none}/* v10.73 : poignées décoratives « trait iOS » retirées partout (confondues avec un retour — retour Vincent). Le vrai drag-handle des filtres n'utilise PAS cette classe → conservé. */
/* 📱 12/09/2026 (test device geste 6) — en PWA plein écran, le bouton Retour de Spot 105+ chevauchait l'heure de la barre d'état : la modale ignorait l'encoche. On réserve les deux insets et on borne la boîte à ce qui reste VISIBLE (dvh, pas vh : la barre Safari ne compte pas). */
.modal-center{position:fixed;inset:0;background:rgba(10,10,10,0.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.modal-center .modal-box{position:relative;background:var(--bg-primary);border-radius:var(--radius-lg);width:100%;max-width:440px;max-height:90vh;max-height:calc(100dvh - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;padding:24px;box-shadow:var(--shadow-lg)}

/* Pill buttons - Partiful */
.pill-btn{padding:8px 9px;border-radius:var(--radius-pill);border:1px solid var(--hairline);background:var(--card);cursor:pointer;font-size:12.5px;font-weight:500;font-family:var(--font-body);color:var(--ink-900);transition:all .15s var(--ease)}
/* v10.43 : actif = OUTLINE (langage B1 №4 étendu à toutes les pastilles) */
.pill-btn.active{border:1.5px solid var(--pop-pink);background:var(--card);color:var(--pop-pink);font-weight:700}
.pill-btn:active{transform:scale(.95)}
/* v10.87 — Propositions « Stories » (variante №1 validée par Vincent le 15/07, ex-bloc .pl-* v10.72 remplacé) :
   plein écran, un dégradé par question, 6 barres cliquables (cible tactile 21px, pas le trait de 3px),
   « Tout » = groupe VIDE → le compteur monte, il ne chute jamais. + onglet ★ recherches enregistrées. */
.pq-wrap{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;overflow:hidden;background:var(--bg-cream)}/* v484 : `height:100dvh` retiré — même classe que F4 (sur iOS plein écran, dvh exclut la barre d'état) ; inset:0 suffit */
.pq-wrap.pq-neon{background:#0B0714}/* v223 : charte Néon Nuit (choix Vincent : couleurs №5 + bandeau №4) — SCOPÉE à l'étape questions */
.pq-in{position:relative;flex:1;display:flex;flex-direction:column;width:100%;max-width:600px;margin:0 auto;min-height:0;overflow:hidden}
.pq-bg{position:absolute;inset:0;z-index:0;transition:background .35s var(--ease)}
.pq-top{position:relative;z-index:2;flex:0 0 auto;padding:calc(8px + env(safe-area-inset-top,0px)) 18px 8px}
.pq-neon .pq-top{padding-bottom:18px;background:linear-gradient(158deg,#FF006E 0%,#2a0016 68%,#0a0007 100%)}/* v223 : BANDEAU magenta→noir (№4) qui fond dans le corps néon nuit */
/* v343 (retour device Vincent 29/07) — BANDE FIGÉE DU PARCOURS TROP HAUTE : mesurée en 390x844 à
   184,8px (q0) / 175,9px (q1) / 232,5px (q4 « Musique ? »), + env(safe-area-inset-top) sur iPhone.
   ⚠️ `.pq-top` est PARTAGÉE par 3 écrans (★ recherches enregistrées, parcours, résultats) → tout le
   compactage est SCOPÉ par la classe `.pq-top-q`, posée uniquement sur l'étape questions. Les deux
   autres écrans gardent exactement leur bande d'origine.
   ⚠️ CORRECTIF v344 : la note d'origine disait « boutons ✕/‹ 34px de haut inchangés et ÉLARGIS à
   44px ». La LARGEUR a en réalité RÉTRÉCI (87,02→44 pour ✕, 104,02→44 pour ‹ en fr) — le « 34 »
   comparé était la HAUTEUR. La compaction, elle, est bien réelle et confirmée (100,63px constants).
   Ce qui reste vrai : aucune cible n'a été rétrécie en HAUTEUR (segments 23px, tabs 26px), aucun
   texte sous 13px. La largeur 44px des deux pastilles est en attente d'arbitrage de Vincent. */
.pq-top-q{padding-top:calc(2px + env(safe-area-inset-top,0px))}
.pq-neon .pq-top-q{padding-bottom:6px}
.pq-top-q .pq-bars{margin-bottom:0}
.pq-top-q .pq-bars .seg{padding:12px 4px 6px}/* même cible tactile (21px / 23px sur l'active), juste remontée dans l'ex-padding du bandeau */
.pq-top-q .pq-row{margin-bottom:3px}
/* 👆 v344 — PLANCHER TACTILE iOS (44px) des pastilles ✕ Quitter et ‹ Précédent.
   Mesuré AVANT : boîte 44 de large × 34 de HAUT, et cible réelle 33px de haut seulement
   (le dernier pixel était déjà mangé par `.pq-h1`, dont la line-height .02 déborde vers le haut).
   La technique « padding + marge négative » de `ProgressBar` ne s'applique PAS ici : ces boutons
   PORTENT la pastille visible (fond + bordure + glow), donc tout padding ferait grossir le visuel.
   On étend donc la ZONE DE TOUCHE seule, au `::after` — un pseudo-élément n'entre dans aucun calcul
   de mise en page : la bande `.pq-top` ne peut pas gagner un pixel, par construction.
   ▸ Extension VERS LE BAS uniquement (bottom:-11px → 34+11 = 45 ; on vise 45 et pas 44 pile parce que
     la rangée tombe sur une position fractionnaire — à 44 exact, la cible sondée au pixel entier rendait
     43). Vers le haut, elle volerait les
     taps des segments `.pq-bars` (leurs 6px de padding bas touchent la rangée). Vers le bas il n'y a
     que le titre `.pq-h1`, qui n'est pas cliquable — zéro tap volé.
   ▸ `z-index:1` est INDISPENSABLE : `.pq-h1` vient APRÈS dans le DOM, donc sans lui il se peindrait
     par-dessus le pseudo-élément et l'extension serait inerte (c'est exactement ce qui rongeait déjà
     1px). Ne pas retirer l'un sans l'autre.
   ▸ Reste borné à l'intérieur de `.pq-top` (rangée à ~59px, extension à ~69px, bande 100,63px) : le
     pseudo-élément ne mord jamais sur `.pq-body`, qui se peindrait au-dessus. */
.pq-hit44{position:relative;z-index:1}
.pq-hit44::after{content:"";position:absolute;left:0;right:0;top:0;bottom:-11px}
/* 👆 v344 — même correctif pour les 2 chips rapides du corps (« Ouvert maintenant » / « 🌙 +5h ») :
   mesurés 36px de haut, 37px de cible. Ils portent eux aussi une pastille visible → `::after`.
   Répartition -5 en haut / -4 en bas (36+9 = 45) : en haut on tient dans les 8px de `padding` de
   `.pq-fill`, en bas dans les 6px de `margin-bottom` de la rangée, ce qui laisse 2px de garde avant
   la première option `.pq-sp` — aucun tap volé aux options, vérifié à l'`elementFromPoint`.
   ⚠️ Si un 3ᵉ chip est ajouté un jour et que la rangée passe sur 2 lignes, l'écart entre lignes est
   de 8px (le `gap:8`) contre 9px d'extension : penser à un `rowGap` avant d'élargir. */
.pq-hit44c{position:relative;z-index:1}
.pq-hit44c::after{content:"";position:absolute;left:0;right:0;top:-5px;bottom:-4px}
/* 👆 v345 (Vincent 29/07) — « Passer › » SORT DE LA LIGNE DU TITRE.
   Mesuré AVANT : boîte 72,11×32 (fr) · 56,47×32 (en) · 66,14×32 (es), et CIBLE RÉELLE 33px de haut,
   sondée à l'`elementFromPoint` — sous le plancher iOS de 44px.
   ▸ Pourquoi pas un simple `::after` comme `.pq-hit44` : la boîte est le DERNIER enfant de `.pq-top`,
     donc toute extension vers le bas sort de la bande et se fait recouvrir par `.pq-body`, peint après
     (même z-index:2, DOM plus tardif). C'est ce mur qui a bloqué le chasseur-bugs.
   ▸ Pourquoi pas un déplacement dans la rangée de contrôles [✕][‹][Tabs] : MESURÉ, ça ne tient pas.
     Largeur nécessaire 416,73px en fr et 386,05px en es pour 354px disponibles → la rangée wrappe,
     soit +38px de bande. Idée écartée par la mesure, pas par principe.
   ▸ CE QU'ON FAIT — la technique validée deux fois dans ce fichier (« ← Retour », « Plus tard ») :
     PADDING + MARGES NÉGATIVES DE MÊME SOMME. `.pq-skip` n'a NI fond NI bordure (juste du texte
     souligné) → grossir son padding est strictement invisible, contrairement aux pastilles ✕/‹.
       · boîte de bordure (= la cible) : 16 de contenu + 15 + 14 = 45px
       · boîte des marges (= ce que le flex mesure) : 45 − 7 − 6 = 32px, EXACTEMENT comme avant
     Donc la ligne du titre reste haute de 32,64px (c'est `.pq-h1` qui la fixe) et `.pq-top` ne gagne
     pas un pixel — garanti par l'arithmétique, pas par l'espoir. Vérifié à 100,63px après coup.
   ▸ La cible quitte donc la ligne du titre (62 → 94,64) pour couvrir 55,64 → 100,64 :
       - en haut, la bande morte du `.pq-row` (les onglets s'arrêtent à 55, on démarre à 55,64 ; on ne
         recouvre que les 3px de `padding` du conteneur `.pq-tabs`, qui n'écoute aucun clic) ;
       - en bas, tout le `padding-bottom` de `.pq-top`, sans jamais mordre sur `.pq-body`.
   ▸ `position:relative;z-index:1` est INDISPENSABLE (même leçon que `.pq-hit44`) : sans lui, la partie
     haute de la cible passerait SOUS `.pq-tabs`, qui vient avant dans le DOM mais se peindrait par-dessus.
     Le texte, lui, ne bouge pas d'un pixel : 55,64 + 15 de padding = 70,64, sa position d'origine.
   ▸ `border-radius:0` : trouvé À LA SONDE, pas déduit. Avec les 999px hérités de `.pq-skip`, le centre
     et les axes répondaient bien 73×45, mais les QUATRE COINS renvoyaient `false` — le hit-testing de
     Chrome respecte l'arrondi, donc une pilule n'est jamais tappable dans ses angles. Ici l'arrondi ne
     dessine RIEN (ni fond ni bordure) : on le remet à 0 et la cible redevient un vrai rectangle. */
.pq-top-q .pq-skip{position:relative;z-index:1;padding:15px 10px 14px;margin-top:-7px;margin-bottom:-6px;border-radius:0}
/* 📸 SEUL EFFET VISUEL MESURÉ des deux classes ci-dessus, dit franchement plutôt que passé sous
   silence : positionner un bouton le fait peindre APRÈS ses voisins non positionnés, donc les halos
   (`box-shadow`) de la pastille ✕ et de la pilule « Tout » se recouvrent dans l'autre sens.
   Chiffré par diff d'images 390×844 fr/Nuit : 0,40 % des pixels touchés, écart max 14/255 (5 %),
   uniquement dans un dégradé de halo. Invisible à l'échelle 1 (il faut amplifier ×18 pour le voir).
   La GÉOMÉTRIE, elle, est identique au centième : `.pq-top` 100,63px, et l'onboarding rend une image
   au MD5 identique. Si on voulait zéro différence de composition, il faudrait passer les voisins en
   `pointer-events:none` plutôt que remonter les boutons — plus invasif, pour un gain non perceptible. */
.pq-body{position:relative;z-index:2;flex:1;min-height:0;overflow:hidden;padding:0 18px}
.pq-foot{position:relative;z-index:2;flex:0 0 auto;padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px))}
.pq-scy{height:100%;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pq-scy::-webkit-scrollbar{display:none}
/* min-height:100% + justify-center : centré quand ça rentre, rien de rogné quand ça dépasse */
.pq-fill{display:flex;flex-direction:column;justify-content:center;min-height:100%;gap:8px;padding:8px 0}
.pq-h1{font-family:var(--font-display);font-weight:900;letter-spacing:-.03em;line-height:1.02;color:#fff;margin:0}
.pq-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.pq-bars{display:flex;gap:3px;margin:0 -4px 2px}
.pq-bars .seg{flex:1;border:none;background:transparent;padding:9px 4px;display:block;cursor:pointer;-webkit-tap-highlight-color:transparent}
.pq-bars .seg i{display:block;height:3px;border-radius:2px;background:rgba(255,255,255,.3);transition:background .2s var(--ease),height .2s var(--ease)}
.pq-bars .seg.done i{background:rgba(255,255,255,.95)}
.pq-bars .seg.here i{background:#fff;height:5px}
.pq-sp{display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;border-radius:999px;border:2px solid rgba(255,255,255,.38);background:rgba(255,255,255,.12);color:#fff;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);text-align:left;font-family:var(--font-body);transition:transform .12s var(--ease),background .18s var(--ease),box-shadow .18s var(--ease)}
.pq-sp:active{transform:scale(.97)}
.pq-sp .e{font-size:21px;line-height:1}
.pq-sp .l{flex:1;font-size:16px;font-weight:800;min-width:0}
.pq-sp.on{background:#fff;border-color:#fff}
/* v223 : pills Néon Nuit (scopées étape questions) — translucide sombre + sélection magenta glow */
.pq-neon .pq-sp{border:1.5px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06)}
.pq-neon .pq-sp.on{background:var(--pink-ink);border-color:var(--pop-pink);color:#fff;box-shadow:0 0 20px rgba(255,0,110,.55)}
.pq-neon .pq-edit{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.22)}/* v225 : ★ Mes recherches sur le bandeau sombre */
.pq-neon .pq-card{background:rgba(255,255,255,.05);color:#fff}
.pq-neon .pq-card .sm{color:rgba(255,255,255,.55)}
.pq-neon .pq-tabs.ink{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.18)}
.pq-neon .pq-tabs.ink .pq-tab{color:#fff;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2)}
.pq-neon .pq-tabs.ink .pq-tab.on{background:#6BFF3D;color:#08150A;border-color:transparent}/* B3 : lime */
.pq-sp.off{opacity:.35;cursor:default}
/* la pilule « Tout » : traitée à part, jamais confondue avec une option */
.pq-sp.all{border-style:dashed;border-color:rgba(255,255,255,.6)}
.pq-sp.all.on{border-style:solid}
.pq-rnd{width:36px;height:36px;border-radius:50%;border:1.5px solid rgba(255,255,255,.45);background:rgba(255,255,255,.14);color:#fff;font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0;flex:0 0 auto;cursor:pointer}
.pq-rnd[disabled]{opacity:.25;cursor:default}
.pq-skip{border:none;background:transparent;color:rgba(255,255,255,.82);font-family:var(--font-body);font-size:13px;font-weight:800;padding:8px 10px;border-radius:999px;white-space:nowrap;text-decoration:underline;text-underline-offset:3px;cursor:pointer;flex:0 0 auto}
.pq-cta{width:100%;border:none;border-radius:999px;background:#fff;font-family:var(--font-body);font-weight:900;font-size:15px;padding:15px;cursor:pointer;box-shadow:0 10px 26px rgba(0,0,0,.18)}
.pq-brand{font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;color:rgba(255,255,255,.7);white-space:nowrap}
.pq-tabs{display:flex;gap:3px;background:rgba(255,255,255,.18);border-radius:999px;padding:3px;flex:0 0 auto}
.pq-tab{border:none;background:rgba(255,255,255,.16);color:#fff;font-family:var(--font-body);font-size:11.5px;font-weight:800;padding:6px 12px;border-radius:999px;white-space:nowrap;cursor:pointer}/* v10.99 : l'inactif garde une pastille visible (avant : transparent → invisible) */
.pq-tab.on{background:#6BFF3D;color:#08150A}/* B3 (Vincent 22/07) : onglet actif = LIME punchy */
.pq-tabs.ink{background:var(--bg-soft);border:1px solid var(--hairline)}
.pq-tabs.ink .pq-tab{color:var(--pop-pink);background:rgba(255,0,110,.10);border:1.5px solid rgba(255,0,110,.3)}/* v10.99 (Vincent) : « Mes recherches » = pastille ROSE contrastée, ne se fond plus dans le fond */
.pq-tabs.ink .pq-tab.on{background:#6BFF3D;color:#08150A;border-color:transparent}/* B3 : lime */
/* cartes préréglages (★ mes recherches) */
.pq-card{display:flex;align-items:center;gap:13px;width:100%;padding:15px;border-radius:20px;border:2px solid var(--hairline);background:var(--bg-primary);color:var(--ink-900);text-align:left;font-family:var(--font-body);cursor:pointer;transition:transform .12s var(--ease)}
.pq-card:active{transform:scale(.985)}
.pq-card .nm{display:block;font-family:var(--font-display);font-weight:900;font-size:19px;letter-spacing:-.02em;line-height:1.15}
.pq-card .sm{display:block;font-size:11.5px;font-weight:600;color:var(--ink-400);margin-top:3px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pq-edit{border:1px solid var(--hairline);background:var(--bg-soft);color:var(--ink-600);font-family:var(--font-body);font-size:11.5px;font-weight:800;border-radius:999px;padding:6px 11px;cursor:pointer;flex:0 0 auto}

/* Inputs - Partiful */
.input-v2{width:100%;padding:12px 16px;border-radius:var(--radius-md);border:1.5px solid var(--hairline);font-size:15px;outline:none;background:var(--input);font-family:var(--font-body);color:var(--ink-900);transition:border-color .2s var(--ease)}

/* Buttons - Partiful */
.btn-primary{width:100%;padding:16px;border-radius:var(--radius-pill);border:none;background:var(--accent-ink);color:#fff;font-weight:600;cursor:pointer;font-size:16px;font-family:var(--font-body);transition:all .15s var(--ease);box-shadow:var(--shadow-pop)}
.btn-primary:active{opacity:.85;transform:scale(.98)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-secondary{width:100%;padding:14px;border-radius:var(--radius-pill);border:1px solid var(--hairline);background:var(--card);color:var(--ink-900);font-weight:600;cursor:pointer;font-size:15px;font-family:var(--font-body)}

.stat-pill{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:var(--radius-pill);background:var(--bg-cream);border:1px solid var(--hairline);font-size:13px;font-weight:500;font-family:var(--font-body);color:var(--ink-900)}

/* v328 (#device-test bug3) : anti-saccade iOS sur les rails horizontaux — favoris, events, « Tu aimeras aussi ».
   🔴 v400 — `touch-action:pan-x` RETIRÉ ICI, et c'était le principal coupable. Retour device de
   Vincent le 07/08 : « dès que j'arrive sur l'image des favoris, ça me bloque ; sur Choisis ton mood
   c'est pas le cas ». Explication exacte de cet écart : « Choisis ton mood » n'est pas un rail, il ne
   porte donc pas cette classe — d'où un écran qui défile et un autre qui refuse.
   `pan-x` ne « laisse pas remonter le vertical au parent » comme le disaient les commentaires : il
   INTERDIT le geste vertical sur l'élément et ses descendants. Doigt posé sur une vignette = page
   figée. `pan-x pan-y` autorise les deux axes ; le rail glisse toujours à l'horizontale.
   ⚠️ C'est bien `overscroll-behavior:contain` qui empêche le chaînage de scroll indésirable — lui
   reste. L'anti-saccade de la v328 est donc préservée, seul le blocage part.
   ⚠️ Cette règle CSS avait été manquée par un premier correctif qui ne visait que les styles en
   ligne : le banc `_test-fiche-v400.mjs` l'a rattrapée en lisant le style CALCULÉ, pas la source. */
.h-scroll{display:flex;gap:12px;overflow-x:auto;padding:4px 0;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;overscroll-behavior:contain;scrollbar-width:none;-ms-overflow-style:none}
.h-scroll::-webkit-scrollbar{display:none}
/* 📏 v400 — LA RANGÉE QUI TIENT SUR UNE LIGNE. Vincent, 07/08 : « le Insta, le menu et le site
   réservé […] ça prend deux lignes. On va réduire la police pour que ça soit que sur une ligne et
   que ce soit la même trame pour tout le monde […] si on n'en a que deux, on n'en a que deux, mais
   du coup faut que tout rentre quand même sur une ligne. »
   Deux leviers, dans cet ordre : on réduit d'abord la police et les marges intérieures — c'est ce
   qui fait rentrer les 3 pastilles dans la largeur d'un iPhone dans l'immense majorité des cas — et
   le glissement horizontal ne sert que de filet pour les noms très longs. L'inverse (glisser sans
   réduire) aurait caché le Menu derrière un geste que personne ne devine.
   ⚠️ `flex-shrink:0` est indispensable : sans lui, un conteneur `nowrap` COMPRIME les pastilles au
   lieu de les faire déborder, et le texte se retrouve tronqué à l'intérieur de chacune. */
.sd-row--1l{flex-wrap:nowrap;overflow-x:auto;overscroll-behavior:contain;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none}
.sd-row--1l::-webkit-scrollbar{display:none}
.sd-row--1l>*{flex:0 0 auto}
/* 📏 18/09/2026 — .sd-tight : compaction du bloc infos de la fiche spot (−25 % en hauteur, décision Vincent).
   Scopé à la fiche : .sd-pill sert aussi ailleurs (13 usages hors SpotDetail), on ne le touche pas. */
.sd-tight .sd-pill{min-height:29px;padding-top:5px;padding-bottom:5px;font-size:12px}
.sd-tight .sd-row{gap:6px}
.sd-tight .h-scroll{padding:1px 0}
.sd-tight .sd-row--1l .sd-pill{font-size:12px}
/* 🎬 18/09/2026 (vague 2) — CTA №15 −33 % : 46 → ~31 px de haut, police et ombre à proportion, même dessin. */
.sd-tight .sd-act{padding:6px 4px;font-size:12px;border-radius:11px;box-shadow:2px 3px 0 rgba(10,10,10,.85)}
:root[data-theme="dark"] .sd-tight .sd-act:not(.surface-light *){box-shadow:2px 3px 0 rgba(0,0,0,.7)}
/* 🧱 18/09/2026 (vague 2, croquis №2 « essentiel / et aussi ») — deux colonnes de même hauteur, cadres fins,
   libellés en petites capitales, une info par ligne, jamais deux lignes (ellipse). */
.sd-cols{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;align-items:stretch}
.sd-col{min-width:0;border:1px solid var(--hairline);border-radius:12px;padding:7px 9px 6px;background:var(--card);display:flex;flex-direction:column}
.sd-col h4{margin:0 0 4px;font-family:var(--font-body);font-size:11px;font-weight:800;font-variant:small-caps;letter-spacing:.06em;color:var(--ink-400);line-height:1.1}
.sd-li{display:flex;align-items:center;gap:5px;min-height:21px;font-family:var(--font-body);font-size:12.5px;font-weight:600;color:var(--ink-900);white-space:nowrap;overflow:hidden;line-height:1.2}
.sd-li .t{min-width:0;overflow:hidden;text-overflow:ellipsis}
.sd-li .ic{flex-shrink:0;font-size:12px;line-height:1}
a.sd-li,button.sd-li{cursor:pointer;background:none;border:0;padding:0;margin:0;width:100%;text-align:left;text-decoration:none;color:var(--ink-900)}
.sd-li .sd-go{margin-left:auto;color:var(--pop-pink);font-weight:900;flex-shrink:0}
.sd-dot{width:8px;height:8px;border-radius:99px;flex-shrink:0}
.sd-li--empty{visibility:hidden}
/* 📐 18/09/2026 (vague 3) — colonnes à 3 lignes, plus petites (11,5 px), pour ne pas repousser la description. */
.sd-tight .sd-col{padding:5px 8px 5px;border-radius:11px}
.sd-tight .sd-col h4{font-size:10px;margin:0 0 2px}
.sd-tight .sd-li{min-height:19px;font-size:11.5px;gap:4px}
.sd-tight .sd-li .ic{font-size:11px}
.sd-links{display:flex;align-items:center;gap:6px;min-height:19px;overflow:hidden;white-space:nowrap}
.sd-links a{display:inline-flex;align-items:center;gap:2px;min-width:0;overflow:hidden;text-overflow:ellipsis;font-family:var(--font-body);font-size:10.5px;font-weight:700;color:var(--ink-900);text-decoration:none;cursor:pointer}
.sd-links a .sd-go{color:var(--pop-pink);font-weight:900;font-size:10px;margin-left:0}
/* 20/09 (demande № 1) — lien de repli affiché SEULEMENT si l'app native ne s'est pas ouverte (voir mspOuvrirNatif) */
.sd-ext-repli{display:inline-flex;align-items:center;gap:2px;padding:3px 0 4px;position:relative;z-index:3;font-family:var(--font-body);font-size:10px;font-weight:700;color:var(--pop-pink);text-decoration:none;white-space:nowrap;cursor:pointer} /* 20/09 banc : z-index 3 > .sd-tap-mid (1) — sans lui, la zone de tap étirée de « Y aller » (margin-top -12,5 px) recouvrait le lien : elementFromPoint rendait le bouton Y aller, le repli était intapable */
.sd-ext-repli .sd-go{color:var(--pop-pink);font-weight:900;font-size:10px}
.sd-li--muted,.sd-li--muted .t{color:var(--ink-400);font-weight:600}
.sd-av{width:16px;height:16px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:900;color:#fff;border:1.5px solid var(--card);flex-shrink:0;margin-left:-5px}
.sd-av:first-child{margin-left:0}
/* 🟢🔴 pastille d'état allumée sur la photo (vague 3) : plein, texte blanc, léger glow de sa couleur */
/* 🎚️ 21/09 (décision Vincent) — LES DEUX PASTILLES DE LA PHOTO À LA MÊME HAUTEUR.
   La pastille de famille est passée à 19,5 px (§ 2.6, −50 %) ; celle-ci était restée à 26,4 px et
   le duo était bancal. Calage : 2×4 de padding + une boîte de ligne de 11,5 px (line-height:1) = 19,5.
   ⚠️ line-height:1 est ce qui FAIT le chiffre — à 1,15 la boîte vaut 13,2 et la pastille retombe à 21,2.
   La pastille ouvre le popover « horaires de la semaine » au tap : la CIBLE reste à 43,5 px via
   ::after, elle ne suit pas la réduction (même recette que .sd-zoom au § 2.4). */
.sd-state{position:relative;display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:999px;border:none;cursor:pointer;font-family:var(--font-body);font-weight:800;font-size:11.5px;color:#fff;white-space:nowrap;overflow:visible;max-width:100%;line-height:1;pointer-events:auto}
/* ⚠️ overflow:visible, et ce n'est PAS un détail : avec overflow:hidden (l'ancienne valeur) le ::after
   de la zone de tap était CLIPPÉ par la pastille — la cible de 43,5 px ne servait à rien, et la mesure
   sonnait « texte tronqué » alors que c'était le pseudo-élément qui dépassait. Le rognage du texte reste
   assuré là où il doit l'être : sur le <span> intérieur, qui porte overflow:hidden + text-overflow. */
.sd-state::after{content:'';position:absolute;inset:-12px;border-radius:999px}
.sd-state--open{background:#00A844;box-shadow:0 0 14px rgba(0,200,83,.55),0 2px 6px rgba(0,0,0,.25)}
.sd-state--closed{background:#D8232A;box-shadow:0 0 14px rgba(229,56,59,.5),0 2px 6px rgba(0,0,0,.25)}
.sd-state--unknown{background:rgba(90,90,100,.85);box-shadow:0 2px 6px rgba(0,0,0,.25);cursor:default;font-size:11.5px;letter-spacing:-.2px;padding:6px 10px}
.sd-state .sd-dot{background:#fff;width:6px;height:6px}
/* 🎚️ 18/09/2026 (vague 4) — poignée Apple en haut de la feuille : glisser vers le bas depuis la poignée ferme la fiche */
/* 📱 20/09/2026 (test device v470, captures iPhone Dynamic Island) — la feuille couvrait TOUT l'écran sur le téléphone : l'heure
   « 12:47 » s'écrivait PAR-DESSUS « Retour » et la poignée touchait le bord physique. Deux causes cumulées : (a) la poignée et le
   Retour étaient calés sur le haut de la FEUILLE (top 0 / 12 px) en supposant qu'elle démarre à 6 vh sous la barre d'état ;
   (b) sur iOS, après le clavier de la recherche Spots, le viewport visuel reste « panné » de ~6 vh et un overlay fixed remonte
   d'autant (cf. v335, même mécanique) — la feuille se retrouvait au bord haut, avec une bande sombre en bas.
   Correctif : la feuille est PLEINE HAUTEUR et déterministe (.sd-sheet, 100dvh — plus d'écart 94 vh à compenser), la photo passe
   derrière la barre d'état (voulu), et poignée / Retour / ⤢ portent env(safe-area-inset-top) : poignée à inset+8, Retour et ⤢ à
   inset+23, flèches photo descendues à 50 %+30 px pour ne pas toucher le groupe ⤢ · 1/4 (mesuré : 1 px de chevauchement à +22). */
.sd-sheet{height:100%;min-height:0;max-height:none}/* v484 F4 : 100dvh → 100 % de l'overlay (sur iOS plein écran, dvh exclut la barre d'état : bande de 59 pt sous la feuille, capture 22/09 18:30) — voir le bloc v484 plus bas */
.sd-grab{position:absolute;top:0;left:0;right:0;height:calc(22px + env(safe-area-inset-top,0px));z-index:21;display:flex;justify-content:center;align-items:flex-start;padding-top:calc(8px + env(safe-area-inset-top,0px));box-sizing:border-box;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.sd-grab i{display:block;width:36px;height:5px;border-radius:99px;background:#fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.38),0 1px 6px rgba(0,0,0,.45)}/* 20/09 : blanc plein + liseré noir → visible sur photo claire comme sombre (avant : gris à 85 %, « on ne la voit pas ») */
/* 👆 20/09/2026 — plus de « carré gris » WebKit : les zones de tap étendues (44 px) de la fiche débordent du texte visible (📞 : 19 px
   sous la bulle, mesuré) et le tap-highlight par défaut rgba(51,181,229,.4) dessinait ce rectangle au tap. Transparent sur TOUTE la
   feuille (28 zones mesurées) ; le retour visuel est maison : .press garde son scale, les lignes des colonnes prennent un fondu iOS. */
.sd-sheet a,.sd-sheet button,.sd-sheet .sd-grab,.sd-sheet [role="button"]{-webkit-tap-highlight-color:transparent}
.sd-sheet a:not(.press):active,.sd-sheet button:not(.press):not(:disabled):active{opacity:.6}
.sd-li.press:active,.sd-links a.press:active{transform:none;opacity:.5;transition:opacity .08s}
/* 👆 I8 — zones de tap ≥ 44 px SANS grossir la bulle : la ligne 1 s'étend vers le HAUT (au-dessus, il n'y a que le
   libellé de colonne), la ligne 3 vers le BAS (en dessous, la marge), la ligne 2 des deux côtés mais SOUS les deux
   autres (z-index) — chaque ligne garde son pas visuel de 19 px et ses voisines ne lui volent pas son texte. */
.sd-tight .sd-tap-up{min-height:44px;padding-top:25px;margin-top:-25px;position:relative;z-index:2;box-sizing:border-box}
/* 📞 21/09 (trame fixe) — ZONE DE TAP DU TÉLÉPHONE, deuxième ligne de « L'essentiel ».
   Elle NE PEUT PAS reprendre .sd-tap-up : au-dessus il y a désormais l'ADRESSE, et un
   pseudo-élément posé dessus capterait l'appui long — plus de sélection, donc plus de § 3.4.
   Elle s'étend donc de 6 px de chaque côté (≈ 31 px de haut) sans jamais atteindre le texte
   de l'adresse. Le chiffre est en dessous des 44 px d'Apple, c'est mesuré et assumé :
   deux lignes de 19 px collées ne peuvent pas porter 44 px chacune sans se recouvrir,
   et la ligne ③ (horaires) a la priorité — c'est elle qui ouvre le popover. */
.sd-tight .sd-tap-tel{position:relative;z-index:1}
.sd-tight .sd-tap-tel::after{content:'';position:absolute;left:-8px;right:-8px;top:-6px;bottom:-6px}
.sd-tight .sd-tap-mid{min-height:44px;margin-top:-12.5px;margin-bottom:-12.5px;position:relative;z-index:1;box-sizing:border-box}
.sd-tight .sd-tap-down{min-height:44px;padding-bottom:25px;margin-bottom:-25px;position:relative;z-index:2;box-sizing:border-box}
.sd-tight .sd-links.sd-tap-up{padding-top:0;height:44px;align-items:flex-end} /* la rangée fait 44 px (pas 25 + 44 : mesuré 69 avant correction), les liens s'étirent dessus */
.sd-links.sd-tap-up a{align-self:stretch;align-items:flex-end;padding-bottom:2px;box-sizing:border-box}
.sd-links{gap:3px} /* 18/09 vague 4 : 3 px — « 🎫 Billets ↗ » débordait encore de 1 px à 4 px */
.sd-links a{font-size:10px;letter-spacing:-.1px;gap:1px;flex-shrink:0;overflow:visible} /* mesuré : à 10,5 px la 3ᵉ flèche dépassait de 4-5 px la bulle ; les liens ne se rognent plus eux-mêmes (sinon la mesure scrollWidth mentait) */
.sd-li .sd-go--near{margin-left:4px}
/* 🕘 21/09 — la ligne ③ des horaires est un <button> dans une trame de lignes de texte. Elle se lit
   comme du texte (décision Vincent : « en texte normal, PAS en pastille ») ; seul le chevron › dit
   qu'elle s'ouvre. Tout ce qu'il faut est DÉJÀ dans `a.sd-li,button.sd-li` et `.sd-tight .sd-li`.
   🔴 NE PAS y remettre `font:inherit` : le raccourci `font` REMET LA TAILLE du parent et, avec une
   spécificité plus forte que `.sd-tight .sd-li`, il faisait rendre la ligne à ~15 px au lieu de 11,5.
   Mesuré : la ligne passait de 19 à 48,3 px de haut et TOUTE la fiche descendait de 4,3 px — soit
   exactement la marge que le § 6.3 venait de gagner. Un réglage de police qui coûte un budget vertical. */
/* ═══════════════════════════════════════════════════════════════════════════
   21/09/2026 — LOT FICHE SPOT § 2 (zone photo) · § 3 (L'essentiel) · § 6 (mise en page)
   du document DEMANDES-2026-09-20. Tous les chiffres ci-dessous ont été MESURÉS en
   pilotant la page buildée à 390 px avec les encoches iPhone simulées
   (Emulation.setSafeAreaInsetsOverride) — sans elles, le Retour se mesure 59 px trop
   haut et le bas de fiche 34 px trop court, et on conclut « ça tient » quand ça déborde.
   Banc : _explorations/batisseur-fiche-2026-09-21/banc-fiche.mjs
   ⚠️ Règle transverse n° 2 : ce qui sort de la vitrine RESTE dans le code. Chaque bloc
   ci-dessous dit en une ligne comment le remettre.
   ═══════════════════════════════════════════════════════════════════════════ */
/* § 2.3 — le petit trait « on peut descendre » sort de la vitrine. Le GESTE reste :
   .sd-grab garde ses handlers, sa zone de 22 px et son curseur. Seule la barre est
   masquée. Remettre = supprimer cette seule règle. */
.sd-grab i{display:none}
/* § 2.4 — le groupe ⤢ · n/m réduit de 30 % (mesuré : ⤢ 32 → 22 px, compteur 39×24 → 27×17).
   La CIBLE DE TAP ne suit pas la réduction : ::after rend 44 px cliquables autour du ⤢,
   sinon on aurait un bouton de 22 px sur un doigt de 44. */
.sd-zoom{position:relative}
.sd-zoom::after{content:'';position:absolute;inset:-11px;border-radius:14px}
/* § 2.6 — pastille de famille réduite de 50 % (mesuré : 39,7 → ~20 px de haut).
   On ne touche PAS à CatPill : il sert partout ailleurs. La réduction vit ici, portée
   par le seul conteneur de la fiche. line-height:1 est indispensable — sans lui la
   boîte de ligne de l'emoji (15 px) fixe la hauteur et la pastille reste à 25 px. */
/* ⚠️ !important n'est PAS un caprice ici : CatPill écrit fontSize, padding et gap EN STYLE
   INLINE (il sert partout dans l'app), et un style inline gagne toujours sur une classe.
   Premier essai sans !important, mesuré : 39,7 → 30 px seulement, soit −24 % au lieu de −50 %,
   parce que seules line-height et border-width (absentes du inline) avaient pris. */
.sd-fam--mini .cat-pill{font-size:8.5px!important;padding:3px 8px!important;gap:3px!important;line-height:1;border-width:1px}
.sd-fam--mini .cat-pill>span:first-child{font-size:9.5px!important;line-height:1}
/* § 3.1 — ligne 1 de « L'essentiel » : avis à gauche, PRIX À DROITE, même ligne.
   Le prix ne se laisse jamais rogner (flex-shrink:0) ; c'est la note qui s'ellipse
   en premier si un jour elle devient plus longue que la bulle. */
.sd-prix{margin-left:auto;padding-left:6px;flex-shrink:0;font-variant-numeric:tabular-nums;white-space:nowrap}
.sd-prix .ic{flex-shrink:0}
/* § 3.3 / 3.4 / 3.5 — L'ADRESSE DESCEND DANS « L'essentiel », ligne 3.
   · 3.4 : sélectionnable pour un copier-coller (Waze, message). La feuille pose
     -webkit-user-select sur ses boutons, pas ici : l'adresse est un bloc de TEXTE.
   · 3.5 (arbitrage Vincent § 15 rép. 1) : police à +25 % par défaut (11,5 → 14,4 px),
     qui DESCEND automatiquement jusqu'à tenir, et JAMAIS coupée. Donc : pas de
     white-space:nowrap, pas de text-overflow:ellipsis, jamais. Elle passe à la ligne.
     La recette est celle, déjà éprouvée, du moteur d'affiches du partage
     (_livrables/partage-2026-09-20/moteur-affinages-affiche.js, fonction adrBlock) :
     réduire la police, puis passer à la ligne, ne jamais tronquer.
   · le CRÉNEAU fait 2 lignes de haut et ne bouge pas : c'est ce qui garantit que la
     bulle a la même hauteur d'une fiche à l'autre (trame figée, décision du 18/09). */
.sd-adr-slot{min-height:34px;display:flex;align-items:flex-start;padding-top:2px}
.sd-adr{font-family:var(--font-body);font-weight:600;color:var(--ink-900);
  font-size:14.4px;line-height:17px;white-space:normal;overflow-wrap:anywhere;
  -webkit-user-select:text;user-select:text;cursor:text;-webkit-touch-callout:default}
.sd-adr .ic{-webkit-user-select:none;user-select:none}
/* § 6.1 — « Dire à mes amis que j'y vais ce soir » : la bulle était à 46,5 px de haut
   pour un texte de 13 px. Compactée à ~30 px (−35 %) et ramenée au second plan (700 au
   lieu de 800, liseré 1,2 px) : elle doit se lire APRÈS le texte, pas avant. */
.sd-going{width:100%;padding:6px 0;border-radius:999px;cursor:pointer;
  font-family:var(--font-body);font-weight:700;font-size:12px;line-height:1.25;
  white-space:nowrap;border:1.2px solid var(--pop-pink);background:transparent;color:var(--pop-pink)}
.sd-going--on{border:none;background:linear-gradient(135deg,var(--pop-pink),#9500FF);color:#fff}
/* § 6.3 / 6.4 — LA FICHE TIENT SUR UN ÉCRAN QUAND RIEN N'EST DÉPLIÉ.
   Mesuré AVANT (v481, encoches simulées) : 856 px de contenu pour 844 de haut → 12 px
   de trop, donc un scroll dès l'ouverture. Les px repris sont listés un par un ici,
   pour qu'on sache quoi rendre le jour où on rajoute un bloc :
     padding bas du bloc infos 38 → 16 ............ −22
     marge haute du bloc « Commencer ma soirée » 24 → 10 ... −14
     marge haute de « Tu aimeras aussi » 24 → 12 .. −12
     titre « Tu aimeras aussi » 18 → 15 px, marge 10 → 6 ... −7
     vignettes « Tu aimeras aussi » 57 → 50 px de photo .... −7
     CTA « Commencer ma soirée » padding 12 → 10 .. −4
     marge haute de la description 16 → 12 ........ −4
   § 6.4 : le scroll ne sert QU'aux dépliements (« Lire la suite », « Y aller ») ; il
   glisse au lieu de sauter. */
.sd-scroll{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){.sd-scroll{scroll-behavior:auto}}
.sd-tight .sd-soiree{padding:10px 0}
/* 📄 description : TOUJOURS la hauteur de 4 lignes ; « Lire la suite » posé dans la 4ᵉ ligne.
   § 5.1 (21/09) : le bloc de texte reste à 81 px (14 px × 20,3 px × 4), et la BULLE fait
   81 + 2 × 12 px de padding = 105 px. box-sizing est border-box partout (l. ~133), donc c'est bien
   105 qu'il faut écrire ici, pas 81 — sinon la bulle rogne le texte d'une ligne et demie. */
/* 🔒 mention « Ce lieu a fermé » — sur la feuille BLANCHE de la fiche. Encre #7A1020 sur #FFE9EC :
   contraste mesuré au banc (`_explorations/batisseur-typo-fermes-2026-09-21/`), voir le chiffre dans son JSON. Le rouge ne porte QUE le fond et le liseré, jamais une info seule
   (l'emoji 🚫 et le texte disent tout — règle d'accessibilité : la couleur n'est jamais le message). */
.sd-closed{display:flex;flex-direction:column;gap:2px;margin:12px 0 0;padding:9px 11px;border-radius:12px;background:#FFE9EC;border:1.5px solid #E0364F;font-family:var(--font-body);color:#7A1020}
.sd-closed b{font-weight:800;font-size:13.5px;line-height:1.2}
.sd-closed span{font-weight:500;font-size:11.5px;line-height:1.3}
.sd-desc{position:relative;margin-top:10px;min-height:105px;background:var(--sd-desc-bg);border-radius:14px;padding:12px 13px}
.sd-desc.is-open{min-height:0}
/* l'interligne est écrit EN PIXELS, jamais en em ni en unité relative : c'est ce qui garantit que
   changer de police ne fait pas gagner de hauteur au bloc (décision § 5.1). */
.sd-desc>p{font-family:var(--font-desc);font-weight:500;font-size:14px;line-height:20.3px;color:var(--sd-desc-ink);margin:0;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
/* le SURLIGNEUR des 5 premiers mots : un FOND tracé bas comme un feutre. `.sd-hl` est un <span>
   décoratif et non un <mark> — <mark> signifie « pertinent pour la recherche » et fait parler
   VoiceOver à chaque fiche pour un effet purement graphique. */
.sd-desc .sd-hl{background:linear-gradient(transparent 55%,var(--sd-desc-hl) 55%);color:var(--sd-desc-ink);padding:0 1px}
.sd-desc .sd-more{position:absolute;right:13px;bottom:12px;margin:0;padding:0 0 0 12px;background:var(--sd-desc-bg);box-shadow:-14px 0 12px -2px var(--sd-desc-bg);border:none;cursor:pointer;font-family:var(--font-body);font-weight:800;font-size:12.5px;line-height:20.3px;color:var(--pink-ink)}
/* ♿ 21/09/2026 — « Lire la suite › » était #FF006E sur le BLANC de la feuille (la fiche est
   .surface-light depuis le 18/09) à 12,5 px : 3,83:1, SOUS le seuil AA. --pink-ink est le même
   magenta assombri (#D1005B), déjà dans la charte depuis la v334 → 5,44:1. Zéro couleur ajoutée. */
/* 🌙 S2 — CTA soirée : blanc (--card en Nuit), texte encre, contour 2 px magenta + ombre portée magenta décalée (famille №15) */
.sd-soiree{width:100%;padding:12px 0;border-radius:14px;border:2px solid #FF006E;background:var(--card);color:var(--ink-900);font-family:var(--font-body);font-weight:800;font-size:14.5px;line-height:1.15;cursor:pointer;box-shadow:3px 4px 0 rgba(255,0,110,.85)}
/* ═══ 🧾 22/09/2026 — LOT 4 : la fiche spot (mobile) — les 10 points, en CSS. Spécificité .sd-sheet … pour
   passer devant les règles du 18-21/09 sans les réécrire (elles restent, historique). ═══ */
/* 4.1 — les DEUX pastilles de la photo : même hauteur EXACTE (20,5 px), même rembourrage vertical (4 px),
   même taille de texte (10,5 px), même coin (999). Largeur libre selon le mot (décision Vincent). */
.sd-sheet .sd-fam--mini{padding:0!important}
.sd-sheet .sd-fam--mini .cat-pill{font-size:10.5px!important;padding:4px 9px!important;gap:4px!important;line-height:1;border-width:1px;box-sizing:border-box;height:20.5px}
.sd-sheet .sd-fam--mini .cat-pill>span:first-child{font-size:10.5px!important;line-height:1}
.sd-sheet .sd-state{padding:4px 9px;font-size:10.5px;line-height:1;border:1px solid transparent;box-sizing:border-box;height:20.5px;border-radius:999px}
/* 4.2 — flèches ‹ › plus étroites (34 → 28 px), la place va au titre ; cible de tap conservée à 44 px. */
.sd-sheet .sd-arrow::after{content:'';position:absolute;inset:-7px -8px;border-radius:999px}
/* v486 F3 — flèches de la PHOTO réduites à 28,5 px : la cible de tap reste à 44,5 px (même recette que .sd-zoom). */
.sd-parr::after{content:'';position:absolute;inset:-8px;border-radius:999px}
/* 4.3 — UNE seule taille de police pour les 6 lignes des deux bulles : 11,5 px (adresse 14,4 → 11,5, liens 10 → 11,5). */
.sd-sheet .sd-tight .sd-li,.sd-sheet .sd-tight .sd-adr,.sd-sheet .sd-links a{font-size:11.5px}
.sd-sheet .sd-links a{letter-spacing:0}
/* 4.4 / 4.5 — l'adresse sur UNE ligne, ellipsée « … » + « › » quand elle déborde ; 3 lignes de 19 px à gauche
   comme à droite, même trame que .sd-li. La bulle ne grandit jamais. */
.sd-sheet .sd-adr-slot{min-height:19px;padding-top:0;align-items:center;position:relative}
.sd-sheet .sd-adr{display:flex;align-items:center;gap:4px;min-height:19px;width:100%;line-height:1.2;white-space:nowrap;overflow:hidden;cursor:default}
.sd-sheet .sd-adr .t{min-width:0;overflow:hidden;text-overflow:ellipsis;-webkit-user-select:text;user-select:text;cursor:text;-webkit-touch-callout:default}
.sd-sheet .sd-links-slot{position:relative}
.sd-sheet .sd-links.is-deb a:nth-child(n+3){display:none}/* le 3e lien ne tient pas → il passe dans la bulle « › » avec les autres */
.sd-deb{background:none;border:0;padding:0 0 0 4px;margin-left:auto;color:var(--pop-pink);font-weight:900;font-size:13px;line-height:1;cursor:pointer;flex-shrink:0;position:relative;font-family:var(--font-body)}
.sd-deb::after{content:'';position:absolute;inset:-12px -8px}
.sd-links .sd-deb{align-self:flex-end;padding-bottom:3px}
.sd-pop{position:absolute;top:calc(100% + 6px);z-index:40;min-width:210px;max-width:calc(100vw - 60px);background:var(--card);border:1px solid var(--hairline);border-radius:12px;box-shadow:0 12px 30px -8px rgba(0,0,0,.35);padding:9px 11px;font-family:var(--font-body);font-size:12.5px;font-weight:600;line-height:1.35;color:var(--ink-900);white-space:normal;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text;cursor:text}
.sd-pop--left{left:0}.sd-pop--right{right:0}
.sd-pop-liens{display:flex;flex-direction:column;gap:9px;-webkit-user-select:none;user-select:none}
.sd-pop-liens a{display:inline-flex;align-items:center;gap:3px;font-family:var(--font-body);font-size:12.5px;font-weight:700;color:var(--ink-900);text-decoration:none;cursor:pointer}
.sd-pop-liens a .sd-go{color:var(--pop-pink);font-weight:900}
/* 4.6 — la description devient la plus grosse bulle de la page : 14 → 16 px, rembourrage 12/13 → 14/15,
   hauteur FIXE conservée pour tous (4 lignes × 23,2 + 2 × 14 = 120,8 → 121 px ; Vincent assume l'air). */
.sd-sheet .sd-desc{min-height:168px;padding:14px 15px;margin-top:4px}/* v486 F5 : 121 → 168 = 6 lignes × 23,2 + 2 × 14 (SD_DESC_LIGNES) *//* 4 et non 10 : dans une colonne flex (4.8) les marges ne fusionnent plus avec les 6 px de .sd-cols */
.sd-sheet .sd-desc>p{font-size:16px;line-height:23.2px}
.sd-sheet .sd-desc .sd-more{right:15px;bottom:14px;font-size:13px;line-height:23.2px}
/* 4.7 — « 👋 Dire à mes amis que j'y vais ce soir » : −30 % (29,4 → 20 px : padding 6 → 3, police 12 → 10,
   liseré 1,2 → 1). Cible de tap remise à 44 px par ::after, elle ne suit pas la réduction. */
.sd-sheet .sd-going{padding:3px 0;font-size:10px;line-height:1.2;border-width:1px;position:relative}
.sd-sheet .sd-going::after{content:'';position:absolute;left:0;right:0;top:-12px;bottom:-12px}
/* 4.8 — plus de bande blanche sous « Tu aimeras aussi » : le scroller est une colonne, le bloc de contenu
   la remplit et le carrousel se cale en bas (margin-top:auto, posé en inline). La feuille reste pleine
   hauteur (décision du 20/09 : la photo passe derrière la barre d'état), c'est l'air qui change de place. */
.sd-sheet .sd-scroll{display:flex;flex-direction:column}
.sd-sheet .sd-tight{flex:1 0 auto;display:flex;flex-direction:column}
/* 4.10 — Retour et ⤢ remontent : inset + 8 px au lieu de + 23 (la poignée de 22 px n'existe plus, 4.9).
   Rien ne passe sous l'encoche (top ≥ safe-area) ; cible de tap ≥ 44 px par ::after. */
.sd-sheet .sd-back{position:absolute}
/* 4.2 — dernier recours, DONNÉE et non rendu : les noms qui ne tiennent pas même à 15 px et −0,06 em (83 sur 5 574
   au 22/09, listés par le banc) s'ellipsent « … » au lieu d'être rognés net ; le nom entier reste dans `title`. */
.sd-sheet h1[data-deborde="1"]{text-overflow:ellipsis}
.sd-sheet .sd-back::after{content:'';position:absolute;inset:-3px -6px -9px;border-radius:999px}/* v486 F2 : le Retour passe à 25,5 px de haut → zone de tap 37,5 × (l + 12) ; elle ne monte que de 3 px (= jusqu'à l'encoche, jamais dessous) et descend de 9 */
/* ═══ 📱 22/09/2026 — v484 : RETOUR iPhone v483 sur la fiche (DEMANDES-2026-09-22 § RETOUR iPhone v483, F1-F4). ═══ */
/* F4 — LA FEUILLE TOUCHE LE BAS DE L'ÉCRAN. Mesuré sur la capture iPhone 18:30 (Plantation Paris) : bande sombre de 58,7 pt
   sous la feuille = env(safe-area-inset-top) (59). Sur iOS en app plein écran (viewport-fit=cover), 100dvh EXCLUT la barre
   d'état alors que l'overlay `position:fixed; inset:0` la couvre → une feuille en 100dvh est plus courte que son overlay de
   59 px, et comme elle est calée en bas (flex-end)… non : elle est calée en HAUT par la photo et l'air apparaît en bas.
   Remède : la feuille remplit son OVERLAY (100 % d'une hauteur définie par inset:0), plus aucune unité d'écran (vh/dvh).
   Pas reproductible en Blink (dvh = innerHeight) : la preuve est l'arithmétique de la capture + le banc (feuille = overlay
   = innerHeight, encoche simulée, avant/après changement de hauteur). La règle elle-même est corrigée à sa place (.sd-sheet, plus haut). */
/* F1 — l'emoji 🧭 de « Y aller » était rogné à GAUCHE (capture 18:30, zoom ×6 : bord plat) : son encre déborde de sa boîte
   d'avance et `.sd-li{overflow:hidden}` la coupait au bord du bouton. Les 6 lignes ne clippent plus (le « … » du texte vit
   dans .t, qui garde son propre overflow) et l'icône a son interligne. */
.sd-sheet .sd-tight .sd-li{overflow:visible}
.sd-sheet .sd-tight .sd-li .ic{line-height:1.25;overflow:visible}
/* F2 — Insta · Site · Menu (ou Billets) sur UNE ligne : la police de CETTE rangée descend par pas de 0,5 px (11,5 → 8,5,
   useAjusteLiens) jusqu'à ce que les 3 tiennent — exception assumée à la police unique du 4.3. Plus de 3e lien dans la
   bulle « › » (elle reste pour l'adresse). */
.sd-sheet .sd-links a{font-size:var(--sd-links-fs,11.5px)}
.sd-sheet .sd-links a .sd-go{font-size:.9em}
/* F3 — « 👋 Dire à mes amis que j'y vais ce soir » : option (a) = 24 px de haut, 11 px, +6 px d'air au-dessus, rembourrage
   horizontal 18 px. Bascule (b) en 10 s : --sd-going-h:29.4px ; --sd-going-fs:12px (réponse de Vincent attendue). */
.sd-sheet{--sd-going-h:24px;--sd-going-fs:11px}
.sd-sheet .sd-going{height:var(--sd-going-h);padding:0 18px;font-size:var(--sd-going-fs);line-height:1;margin-top:6px;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.sd-row--1l .sd-pill{font-size:12.5px;padding-left:11px;padding-right:11px;white-space:nowrap}
.hide-scroll{scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch}
.hide-scroll::-webkit-scrollbar{display:none}
.h-scroll>*{scroll-snap-align:start;flex-shrink:0}

@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.anim-delay-1{animation:fadeInUp .5s var(--ease) .5s both}
.anim-delay-2{animation:fadeInUp .5s var(--ease) 1.5s both}
.anim-delay-3{animation:fadeInUp .5s var(--ease) 2.5s both}
.anim-delay-4{animation:fadeInUp .5s var(--ease) 3.5s both}

/* Floating emoji (micro-interactions favori, fait, ajout) */
.msp-pop{position:fixed;left:50%;top:50%;font-size:80px;pointer-events:none;z-index:9998;animation:mspPop .9s cubic-bezier(0.4,0,0.2,1) both;will-change:transform,opacity;text-shadow:0 4px 20px rgba(0,0,0,0.15)}
@keyframes mspPop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(0.3)}
  20%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}
  60%{opacity:1;transform:translate(-50%,-90%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-150%) scale(0.85)}
}

/* Splash screen — affiché avant que React monte */
#msp-splash{position:fixed;inset:0;z-index:99999;background:var(--bg-primary);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;font-family:"Fraunces",Georgia,serif;transition:opacity .35s ease}
#msp-splash.msp-splash-out{opacity:0;pointer-events:none}
#msp-splash .msp-splash-logo{width:96px;height:96px;border-radius:24px;box-shadow:0 16px 40px rgba(255,0,110,0.25);animation:mspBob 1.4s ease-in-out infinite}
#msp-splash .msp-splash-title{font-weight:900;font-size:28px;letter-spacing:-0.015em;color:#0A0A0A;margin:0}
#msp-splash .msp-splash-sub{font-family:"Inter",system-ui,sans-serif;font-size:13px;color:#7A7A7A;margin-top:-12px}
@keyframes mspBob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}

/* Toasts */
.toast-stack{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;display:flex;flex-direction:column;gap:8px;z-index:9999;width:calc(100% - 32px);max-width:420px;pointer-events:none}
.toast{pointer-events:auto;padding:12px 16px;border-radius:var(--radius-md);font-family:var(--font-body);font-size:14px;font-weight:500;line-height:1.35;box-shadow:var(--shadow-md);animation:slideUp .25s var(--ease) both;display:flex;align-items:center;gap:10px}
.toast-info{background:var(--panel-ink);color:#fff}
.toast-success{background:#16A34A;color:#fff}
.toast-warn{background:#FFD23F;color:var(--ink-900)}
/* 🌙 LES TOASTS EN NUIT — déck TCH du 06/08, choix de Vincent : №1.2 et №4.4.
   ─────────────────────────────────────────────────────────────────────────────
   HISTORIQUE, parce qu'il explique la forme du correctif. `.toast-warn` posait un fond
   `#FFD23F` EN DUR (le jaune de la charte, il ne bascule pas) sous un `color:var(--ink-900)`
   qui, lui, BASCULE : #0A0A0A en Jour → #F4EFFA en Nuit. Mesuré au ratio WCAG sur le toast
   réellement rendu : 13,71:1 en Jour, **1,28:1 en Nuit**. Le message existait, il était peint
   invisible. Et ce n'était pas cosmétique : `toast-warn` est le SEUL rendu des 9 messages
   d'échec du chantier « soirée à plusieurs » (`dec_ko`, `dec_ko_plan`, `dec_partiel`,
   `dec_step_gone`, `dec_spot_gone`, `dec_hand_ko`, `prop_ko`, `prop_refused`,
   `prop_withdraw_ko`) ET du « on n'a pas ce genre » de la v395 (`pds_genre_absent`).

   CE QUE VINCENT A TRANCHÉ (deck `_explorations/local_neoniste-nuit-2026-08-06.html`) :
     · №1.2 — l'avertissement passe en surface SOMBRE + texte jaune (Néon Nuit), au lieu de
       l'aplat jaune. Le jaune redevient un signal, il ne fait plus un mur de lumière dans
       une app aubergine.
     · №4.4 — la réussite pareil, mais **en Nuit SEULEMENT**. Vincent a explicitement refusé
       de toucher au Jour sur ce point : le vert #16A34A du Jour reste tel quel (3,30:1,
       sous AA — c'est assumé et daté, ce n'est pas un oubli).

   POURQUOI TOUT EST SCOPÉ `:root[data-theme="dark"]` : en Jour le sélecteur ne matche pas.
   Le Jour est donc intact par CONSTRUCTION, pas par vérification a posteriori. */
:root[data-theme="dark"] .toast-warn{background:#241C08;color:#FFD23F;border:1px solid rgba(255,210,63,.45)}
:root[data-theme="dark"] .toast-success{background:#0C2414;color:#6BFF3D;border:1px solid rgba(107,255,61,.45)}
.toast-error{background:#E11D48;color:#fff}
.toast .toast-icon{font-size:18px;line-height:1;flex-shrink:0}
.toast-out{animation:fadeOut .25s var(--ease) both}
@keyframes fadeOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(8px)}}
</style>

<script>
// 🔄 SW + mise à jour in-app : le SW fait déjà skipWaiting+claim, donc quand une nouvelle
// version s'active pendant que la page est ouverte → controllerchange → bannière « Mettre à jour »
// (un reload suffit, le HTML est network-first). reg.update() est forcé à chaque retour au premier
// plan car iOS PWA ne vérifie presque jamais tout seul — fini les 2 force-quits.
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then((reg) => {
      let last = 0;
      const check = () => { const now = Date.now(); if (now - last > 60000) { last = now; reg.update().catch(() => {}); } };
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
      window.addEventListener('focus', check);
      setInterval(check, 30 * 60000);
    }).catch(() => {});
    let hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController) { hadController = true; return; } // toute première installation : rien à recharger
      if (document.getElementById('msp-update-banner')) return;
      const b = document.createElement('div');
      b.id = 'msp-update-banner';
      b.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:9000;display:flex;align-items:center;gap:12px;background:#171726;color:#fff;padding:10px 12px 10px 18px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.35);font-family:system-ui,-apple-system,sans-serif;font-size:14px;font-weight:600;max-width:92vw;white-space:nowrap;';
      const label = document.createElement('span');
      label.textContent = '✨ Nouvelle version dispo';
      const btn = document.createElement('button');
      btn.textContent = 'Mettre à jour';
      btn.style.cssText = 'border:none;border-radius:999px;padding:9px 15px;background:linear-gradient(135deg,#FF006E,#0A0A0A);color:#fff;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit;flex-shrink:0;';
      btn.onclick = () => { b.remove(); location.reload(); };
      b.appendChild(label); b.appendChild(btn);
      document.body.appendChild(b);
    });
  });
}
</script>
